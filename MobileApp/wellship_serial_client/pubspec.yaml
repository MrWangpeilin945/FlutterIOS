name: wellship_serial_client
description: "WELLSHIP ResultCollector serial connection client app for equipments."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  auto_route: ^9.2.2
  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.20.5
  freezed_annotation: ^2.4.4
  hooks_riverpod: ^2.6.1
  typed_data: ^1.3.2
  url_launcher: ^6.3.1
  usb_serial: ^0.5.2
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1
  retry: ^3.1.2
  shared_preferences: ^2.3.5

dev_dependencies:
  auto_route_generator: ^9.0.0
  build_runner:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  freezed: ^2.5.7

flutter:
  uses-material-design: true
