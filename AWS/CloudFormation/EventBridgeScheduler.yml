Parameters:
  ApplicationName:
    Type: String
  EnvType:
    Type: String
  TenantName:
    Type: String

Mappings:
  EnvMap:
    stg:
      Arn: arn:aws:lambda:ap-northeast-1:961341540592:function:invoke-daily-data-import-api
      RoleArn: arn:aws:iam::961341540592:role/wellship-stg-iam-role-eventbridge
    prd:
      Arn: prd環境のLambda関数ARN
      RoleArn: prd環境のLambda関数実行ロールARN

Resources:
  dailyDataImportSchedule:
    Type: AWS::Scheduler::Schedule 
    Properties:
      Name: !Sub ${ApplicationName}-daily-data-import-schedule-${TenantName}
      GroupName: default
      ScheduleExpression: cron(0 1 * * ? *)
      ScheduleExpressionTimezone: Asia/Tokyo
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !FindInMap [EnvMap, !Ref EnvType, Arn]
        RoleArn: !FindInMap [EnvMap, !Ref EnvType, RoleArn]
        Input: !Sub
          - '{ "bucketName": "${FileshareBucketName}" }'
          - FileshareBucketName: !ImportValue FileshareBucketName
      State: ENABLED