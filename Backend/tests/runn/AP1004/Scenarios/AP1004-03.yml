desc: AP1004-03 会場日程取得_指定した班が存在しない [404]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: true
vars:
  date: "2024-10-01"
  teamId: "4425996f-1d4b-45d6-a2c1-c626c9c6af31"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  get:
    desc: "会場日程取得_指定した班が存在しない"
    req:
      /api/v1/placeSchedules/places?date={{ vars.date }}&teamId={{ vars.teamId }}:
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 404
    dump:
      expr: current.res.body
      out: ../Dump/AP1004-03.json

