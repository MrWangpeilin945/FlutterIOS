desc: EC2011-02 職員を更新_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2011-02.json"
steps:
  getStaffs:
    desc: "リクエスト前の職員情報を取得"
    db:
      query: |
        SELECT
          staff_code
          , login_id
          , name
          , enabled
          , role_id
          , password_hash::text
          , password_salt::text
        FROM
          resultcollector.staffs
        WHERE
          staff_code in ('201103', '201104')
        ORDER BY
          staff_code DESC;
    bind:
      passwordHash: current.rows[0].password_hash
      passwordSalt: current.rows[0].password_salt
      preStaffData: current.rows
  post:
    desc: "職員を更新_正常"
    req:
      /api/v1/external/staffs:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
    dump:
      expr: current.res.body
      out: ../Dump/EC2011-02.json
  confirmStaffs:
    desc: "職員の更新を確認"
    db:
      query: |
        SELECT
          staff_code
          , login_id
          , name
          , enabled
          , role_id
          , password_hash::text
          , password_salt::text
        FROM
          resultcollector.staffs
        WHERE
          staff_code in ('201103', '201104')
        ORDER BY
          staff_code DESC;
    test: |
      len(current.rows) == 2
      // リクエストの1つの職員の情報が変更されたことを確認
      && current.rows[0].staff_code == "201104"
      && current.rows[0].login_id == "S201104"
      && current.rows[0].name == "管理者職員_乙"
      && current.rows[0].enabled == true
      && current.rows[0].role_id == 20
      // パスワードハッシュ・ソルトは変更されることを確認
      && current.rows[0].password_hash != VaryPasswordHash
      && current.rows[0].password_salt != VaryPasswordSalt
      // リクエストに存在しない職員情報は変更されないことを確認
      && current.rows[1].staff_code == preStaffData[1].staff_code
      && current.rows[1].login_id == preStaffData[1].login_id
      && current.rows[1].name == preStaffData[1].name
      && current.rows[1].enabled == preStaffData[1].enabled
      && current.rows[1].role_id == preStaffData[1].role_id
      && current.rows[1].password_hash == preStaffData[1].password_hash
      && current.rows[1].password_salt == preStaffData[1].password_salt
