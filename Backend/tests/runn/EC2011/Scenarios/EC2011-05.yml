desc: EC2011-05 必須エラーを除外_正常 [207]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2011-05.json"
steps:
  clearTable:
    desc: "職員テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.staffs CASCADE;
  post:
    desc: "必須エラーを除外"
    req:
      /api/v1/external/staffs:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 14
      // 必須項目不足のレコードがエラーで返される
      && current.res.body[0].code == "10004"
      && current.res.body[0].message == "必須項目が不足しています。StaffCode"
      && current.res.body[0].inputNote == "20110501"
      && current.res.body[1].code == "10004"
      && current.res.body[1].message == "必須項目が不足しています。LoginId"
      && current.res.body[1].inputNote == "20110502"
      && current.res.body[2].code == "10004"
      && current.res.body[2].message == "必須項目が不足しています。Name"
      && current.res.body[2].inputNote == "20110503"
      && current.res.body[3].code == "10004"
      && current.res.body[3].message == "必須項目が不足しています。Password"
      && current.res.body[3].inputNote == "20110504"
      && current.res.body[4].code == "10004"
      && current.res.body[4].message == "必須項目が不足しています。StaffCode"
      && current.res.body[4].inputNote == "20110506"
      && current.res.body[5].code == "10004"
      && current.res.body[5].message == "必須項目が不足しています。LoginId"
      && current.res.body[5].inputNote == "20110506"
      && current.res.body[6].code == "10004"
      && current.res.body[6].message == "必須項目が不足しています。Name"
      && current.res.body[6].inputNote == "20110506"
      && current.res.body[7].code == "10004"
      && current.res.body[7].message == "必須項目が不足しています。Password"
      && current.res.body[7].inputNote == "20110506"
      && current.res.body[8].code == "10006"
      && current.res.body[8].message == "値の形式が無効です。LoginId:"
      && current.res.body[8].inputNote == "20110502"
      && current.res.body[9].code == "10006"
      && current.res.body[9].message == "値の形式が無効です。LoginId:"
      && current.res.body[9].inputNote == "20110506"
      && current.res.body[10].code == "10003"
      && current.res.body[10].message == "キー項目が重複しています。StaffCode:"
      && current.res.body[10].inputNote == "20110501"
      && current.res.body[11].code == "10003"
      && current.res.body[11].message == "キー項目が重複しています。StaffCode:"
      && current.res.body[11].inputNote == "20110506"
      && current.res.body[12].code == "10003"
      && current.res.body[12].message == "キー項目が重複しています。LoginId:"
      && current.res.body[12].inputNote == "20110502"
      && current.res.body[13].code == "10003"
      && current.res.body[13].message == "キー項目が重複しています。LoginId:"
      && current.res.body[13].inputNote == "20110506"
    dump:
      expr: current.res.body
      out: ../Dump/EC2011-05.json
  confirmStaffs:
    desc: "職員情報が変更されていないことを確認"
    db:
      query: |
        SELECT
          staff_code
          , login_id
          , name
          , enabled
          , role_id
          , password_hash::text
          , password_salt::text
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.staffs
    test: |
      len(current.rows) == 1
      // エラーのない職員のみは登録される
      && current.rows[0].staff_code == "20110505"
      && current.rows[0].login_id == "S201105"
      && current.rows[0].name == "職員05"
      && current.rows[0].enabled == true
      && current.rows[0].role_id == 10
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
