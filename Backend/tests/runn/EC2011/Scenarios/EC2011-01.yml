desc: EC2011-01 職員を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2011-01.json"
steps:
  post:
    desc: "職員を登録_正常"
    req:
      /api/v1/external/staffs:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
    dump:
      expr: current.res.body
      out: ../Dump/EC2011-01.json
  confirmStaffs:
    desc: "職員の登録を確認"
    db:
      query: |
        SELECT
          staff_code
          , login_id
          , name
          , enabled
          , role_id
        FROM
          resultcollector.staffs
        WHERE
          staff_code in ('201101', '201102')
        ORDER BY
          staff_code ASC;
    test: |
      len(current.rows) == 2
      // リクエストの２件の職員が登録される
      && current.rows[0].staff_code == "201101"
      && current.rows[0].login_id == "S201101"
      && current.rows[0].name == "管理者職員"
      && current.rows[0].enabled == true
      && current.rows[0].role_id == 20
      && current.rows[1].staff_code == "201102"
      && current.rows[1].login_id == "S201102"
      && current.rows[1].name == "一般職員"
      && current.rows[1].enabled == false
      && current.rows[1].role_id == 10
