desc: EC2011-01 職員を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2011-01.json"
steps:
  clearTable:
    desc: "職員テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.staffs CASCADE;
  post:
    desc: "職員を登録_正常"
    req:
      /api/v1/external/staffs:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && current.res.body == null
  confirmStaffs:
    desc: "職員の登録を確認"
    db:
      query: |
        SELECT
          staff_code
          , login_id
          , name
          , enabled
          , role_id
          , password_hash::text
          , password_salt::text
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.staffs
        ORDER BY
          staff_code ASC;
    test: |
      len(current.rows) == 2
      // リクエストの２件の職員が登録される
      && current.rows[0].staff_code == "201101"
      && current.rows[0].login_id == "S201101"
      && current.rows[0].name == "管理者職員"
      && current.rows[0].enabled == true
      && current.rows[0].role_id == 20
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].staff_code == "201102"
      && current.rows[1].login_id == "S201102"
      && current.rows[1].name == "一般職員"
      && current.rows[1].enabled == false
      && current.rows[1].role_id == 10
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"