desc: EC2011-06 制限：文字数エラーを除外_正常 [207]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2011-06.json"
steps:
  clearTable:
    desc: "職員テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.staffs CASCADE;
  post:
    desc: "制限：文字数エラーを除外"
    req:
      /api/v1/external/staffs:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 4
      // 文字数超過のレコードがエラーで返される
      && current.res.body[0].code == "10005"
      && current.res.body[0].message == "制限数を超えています。LoginId:S20110289012345678901"
      && current.res.body[0].inputNote == "20110602"
      && current.res.body[1].code == "10005"
      && current.res.body[1].message == "制限数を超えています。LoginId:S20110489012345678901"
      && current.res.body[1].inputNote == "20110604"
      && current.res.body[2].code == "10005"
      && current.res.body[2].message == "制限数を超えています。Password:P@ssw0rd0312345678901"
      && current.res.body[2].inputNote == "20110603"
      && current.res.body[3].code == "10005"
      && current.res.body[3].message == "制限数を超えています。Password:P@ssw0rd0412345678901"
      && current.res.body[3].inputNote == "20110604"
    dump:
      expr: current.res.body
      out: ../Dump/EC2011-05.json
  confirmStaffs:
    desc: "職員情報が変更されていないことを確認"
    db:
      query: |
        SELECT
          staff_code
          , login_id
          , name
          , enabled
          , role_id
          , password_hash::text
          , password_salt::text
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.staffs
    test: |
      len(current.rows) == 3
      // エラーのない職員のみは登録される
      && current.rows[0].staff_code == "20110601"
      && current.rows[0].login_id == "S2011018901234567890"
      && current.rows[0].name == "職員01"
      && current.rows[0].enabled == true
      && current.rows[0].role_id == 10
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].staff_code == "5"
      && current.rows[1].login_id == "5"
      && current.rows[1].name == "5"
      && current.rows[1].enabled == true
      && current.rows[1].role_id == 10
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      && current.rows[2].staff_code == "staffCode_abcdefghijklmnopqrstuvwxyABCDEFGHIJKLMNOPQRSTUVWXY0123456789　 012345678901234567890123456789"
      && current.rows[2].login_id == "S201106"
      && current.rows[2].name == "name_abcdefghijklmnopqrstuvwxyABCDEFGHIJKLMNOPQRSTUVWXY0123456789　 012345678901234567890123456789"
      && current.rows[2].enabled == true
      && current.rows[2].role_id == 10
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"
