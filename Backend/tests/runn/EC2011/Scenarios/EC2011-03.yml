desc: EC2011-03 ログインIDが異なる職員コードで登録されている [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2011-03.json"
  loginId: "S201105"
  errorMessage: "指定されたLoginIdが既に登録済みです。"
steps:
  getStaffs:
    desc: "リクエスト前の職員情報を取得"
    db:
      query: |
        SELECT
          staff_code
          , login_id
          , name
          , enabled
          , role_id
          , password_hash::text 
          , password_salt::text
        FROM
          resultcollector.staffs
        WHERE
          login_id = '{{ vars.loginId }}'
    bind:
      staffData: current.rows[0]
  post:
    desc: "ログインIDが異なる職員コードで登録されている"
    req:
      /api/v1/external/staffs:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && len(current.res.body) == 1
      // ログインIDがErrorObjectで返される
      && current.res.body[0].code == "10002"
      && current.res.body[0].inputNote == "2011031"
      && current.res.body[0].message startsWith vars.errorMessage
    dump:
      expr: current.res.body
      out: ../Dump/EC2011-03.json
  confirmStaffs:
    desc: "職員情報が変更されていないことを確認"
    db:
      query: |
        SELECT
          staff_code
          , login_id
          , name
          , enabled
          , role_id
          , password_hash::text
          , password_salt::text
        FROM
          resultcollector.staffs
        WHERE
          login_id = '{{ vars.loginId }}'
    test: |
      len(current.rows) == 1
      && current.rows[0].staff_code == staffData.staff_code
      && current.rows[0].login_id == staffData.login_id
      && current.rows[0].name == staffData.name
      && current.rows[0].enabled == staffData.enabled
      && current.rows[0].role_id == staffData.role_id
      && current.rows[0].password_hash == staffData.password_hash
      && current.rows[0].password_salt == staffData.password_salt
