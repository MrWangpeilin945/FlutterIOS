      /api/v1/external/staffs:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 41
      // 文字種類エラーに含まれないこと
      && current.res.body[0].code == "10005"
