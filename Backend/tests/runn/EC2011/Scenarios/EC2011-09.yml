  post:
    desc: "除外されてないものは追加更新"
    req:
      /api/v1/external/staffs:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 30
      && current.res.body[0].code == "10004" && current.res.body[0].message == "必須項目が不足しています。StaffCode"                  && current.res.body[0].inputNote == "20110903"
      && current.res.body[1].code == "10004" && current.res.body[1].message == "必須項目が不足しています。LoginId"                    && current.res.body[1].inputNote == "20110904"
