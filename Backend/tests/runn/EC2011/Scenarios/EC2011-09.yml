    db: 
      query: |
        insert into resultcollector.staffs(staff_id, staff_code, login_id, name, password_hash, password_salt, enabled, role_id, created_at, created_by)
            values('c0002012-0000-0000-0000-000000000002', '20110902','S201102', '管理職員　甲', '00', '00' , false, 20, '2025-01-01T12:34:56.789', 'ex2011')
            ,     ('c0002012-0000-0000-0000-000000000020', '20110920','S201120', '一般職員　乙', '00', '00' , false, 10, '2025-01-01T12:34:56.789', 'ex2011')
            ,     ('c0002012-0000-0000-0000-000000009900', '20110990','S999900', '既存職員　松', '00', '00' , false, 20, '2025-01-01T12:34:56.789', 'ex2011')
