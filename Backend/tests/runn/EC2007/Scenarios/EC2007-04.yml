desc: EC2007-04 キー重複を除外_正常 [207]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2007-04.json"
steps:
  clearTable:
    desc: "会場テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.places CASCADE;
  insertData:
    desc: "会場テーブルに実行前データを登録"
    db: 
      query: |
        insert into resultcollector.places(place_code, name, order_number, created_at, created_by)
            values('P2007-04-1', '旧第１会場', 1, '2025-01-01T12:34:56.789', 'ec2007')
            ,     ('P2007-04-2', '旧第２会場', 2, '2025-01-01T12:34:56.789', 'ec2007');
  post:
    desc: "会場を更新_正常"
    req:
      /api/v1/external/places:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 2
      // キー重複のレコードがエラーで返される
      && current.res.body[0].code == "10003"
      && current.res.body[0].inputNote == "20070402A"
      && current.res.body[0].message == "キー項目が重複しています。Code:P2007-04-2"
      && current.res.body[1].code == "10003"
      && current.res.body[1].inputNote == "20070402B"
      && current.res.body[1].message == "キー項目が重複しています。Code:P2007-04-2"
    dump:
      expr: current.res.body
      out: ../Dump/EC2006-04.json
  confirmPlaces:
    desc: "会場の更新を確認"
    db:
      query: |
        SELECT
          place_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.places
        ORDER BY
          place_code ASC;
    test: |
      len(current.rows) == 2
      // 会場が変更されないことを確認
      && current.rows[0].place_code == "P2007-04-1"
      && current.rows[0].name == "旧第１会場"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == "20250101"
      && current.rows[0].created_by == "ec2007"
      && current.rows[1].place_code == "P2007-04-2"
      && current.rows[1].name == "旧第２会場"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == "20250101"
      && current.rows[1].created_by == "ec2007"