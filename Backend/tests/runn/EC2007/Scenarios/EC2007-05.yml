desc: EC2007-05 除外されてないものは追加更新_正常 [207]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2007-05.json"
steps:
  clearTable:
    desc: "会場テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.places CASCADE;
  insertData:
    desc: "会場テーブルに実行前データを登録"
    db: 
      query: |
        insert into resultcollector.places (place_code, name , order_number , created_at, created_by) 
            values('P2007-05-1', '旧第１会場', 1, '2025-01-01T12:34:56.789', 'EC2007') 
            ,     ('P2007-05-2', '旧第２会場', 2, '2025-01-01T12:34:56.789', 'EC2007')
            ,     ('P2007-05-3', '旧第３会場', 3, '2025-01-01T12:34:56.789', 'EC2007')
            ,     ('P2007-05-99', '旧第９９会場', 99, '2025-01-01T12:34:56.789', 'EC2007');
  post:
    desc: "会場を更新_正常"
    req:
      /api/v1/external/places:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 6
      // 必須項目不足のレコードがエラーで返される
      && current.res.body[0].code == "10004"
      && current.res.body[0].inputNote == "20070502"
      && current.res.body[0].message == "必須項目が不足しています。Code"
      && current.res.body[1].code == "10004"
      && current.res.body[1].inputNote == "20070504"
      && current.res.body[1].message == "必須項目が不足しています。Code"
      // キー重複のレコードがエラーで返される
      && current.res.body[2].code == "10003"
      && current.res.body[2].inputNote == "20070502"
      && current.res.body[2].message == "キー項目が重複しています。Code:"
      && current.res.body[3].code == "10003"
      && current.res.body[3].inputNote == "20070503"
      && current.res.body[3].message == "キー項目が重複しています。Code:P2007-05-3"
      && current.res.body[4].code == "10003"
      && current.res.body[4].inputNote == "20070504"
      && current.res.body[4].message == "キー項目が重複しています。Code:"
      && current.res.body[5].code == "10003"
      && current.res.body[5].inputNote == "20070505"
      && current.res.body[5].message == "キー項目が重複しています。Code:P2007-05-3"
    dump:
      expr: current.res.body
      out: ../Dump/EC2007-05.json
  confirmPlaces:
    desc: "会場の更新を確認"
    db:
      query: |
        SELECT
          place_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.places
        ORDER BY
          place_code ASC;
    test: |
      len(current.rows) == 5
      // エラーの無いリクエストの会場が追加・変更されたことを確認
      && current.rows[0].place_code == "P2007-05-1"
      && current.rows[0].name == "新第１会場"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[3].place_code == "P2007-05-6"
      && current.rows[3].name == "新第６会場"
      && current.rows[3].order_number == 101
      && current.rows[3].created_at == current.rows[3].now
      && current.rows[3].created_by == "ExternalConnection"
      // 除外された会場の名称は変更されないことを確認
      && current.rows[1].place_code == "P2007-05-2"
      && current.rows[1].name == "旧第２会場"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == "20250101"
      && current.rows[1].created_by == "EC2007"
      && current.rows[2].place_code == "P2007-05-3"
      && current.rows[2].name == "旧第３会場"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == "20250101"
      && current.rows[2].created_by == "EC2007"
      && current.rows[4].place_code == "P2007-05-99"
      && current.rows[4].name == "旧第９９会場"
      && current.rows[4].order_number == 99
      && current.rows[4].created_at == "20250101"
      && current.rows[4].created_by == "EC2007"
