desc: EC2007-02 会場を更新_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2007-02.json"
steps:
  clearTable:
    desc: "会場テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.places CASCADE;
  insertData:
    desc: "会場テーブルに実行前データを登録"
    db: 
      query: |
        insert into resultcollector.places(place_code, name, order_number, created_at, created_by)
            values('P2007-02-1', '旧第１会場', 1, '2025-01-01T12:34:56.789', 'ec2007')
            ,     ('P2007-02-2', '旧第２会場', 2, '2025-01-01T12:34:56.789', 'ec2007')
            ,     ('P2007-02-3', '旧第３会場', 3, '2025-01-01T12:34:56.789', 'ec2007');
  post:
    desc: "会場を更新_正常"
    req:
      /api/v1/external/places:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // レスポンスにErrorObjectが返されないことを確認
      && current.res.body == null
  confirmPlaces:
    desc: "会場の更新を確認"
    db:
      query: |
        SELECT
          place_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.places
        ORDER BY
          place_code ASC;
    test: |
      len(current.rows) == 3
      // リクエストの２つの会場の名称は変更されたことを確認
      && current.rows[0].place_code == "P2007-02-1"
      && current.rows[0].name == "新第１会場"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].place_code == "P2007-02-2"
      && current.rows[1].name == "新第２会場"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      // リクエストに存在しない会場の名称は変更されないことを確認
      && current.rows[2].place_code == "P2007-02-3"
      && current.rows[2].name == "旧第３会場"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == "20250101"
      && current.rows[2].created_by == "ec2007"