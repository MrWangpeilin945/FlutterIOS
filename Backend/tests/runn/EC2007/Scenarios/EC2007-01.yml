desc: EC2007-01 会場を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2007-01.json"
steps:
  clearTable:
    desc: "班テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.places CASCADE;
  post:
    desc: "会場を登録_正常"
    req:
      /api/v1/external/places:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && current.res.body == null
  confirmPlaces:
    desc: "会場の登録を確認"
    db:
      query: |
        SELECT
          place_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.places
        ORDER BY
          place_code ASC;
    test: |
      len(current.rows) == 3
      && current.rows[0].place_code == "P2007-01-1"
      && current.rows[0].name == "第１会場"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].place_code == "P2007-01-2"
      && current.rows[1].name == "第２会場"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      && current.rows[2].place_code == "P2007-01-3"
      && current.rows[2].name == "第３会場"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"