desc: EC2014-02 基準値パターンを更新_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2014-02.json"
steps:
  clearTable:
    desc: "基準値パターンテーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.thresholds CASCADE
  insertData:
    desc: "基準値パターンテーブルに実行前データを登録"
    db:
      query: |
        INSERT INTO resultcollector.thresholds (threshold_code, name, order_number, created_at, created_by)
            VALUES('T2014-02-1', '一般健診', 1, '2025-01-01T12:34:56.789', 'ec2014')
            ,     ('T2014-02-2', '職員健診', 2, '2025-01-01T12:34:56.789', 'ec2014')
            ,     ('T2014-02-3', '日帰りドック', 3, '2025-01-01T12:34:56.789', 'ec2014');
  post:
    desc: "基準値パターンを更新_正常"
    req:
      /api/v1/external/thresholds:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // レスポンスにErrorObjectが返されないことを確認
      && current.res.body == null
  confirmThresholds:
    desc: "基準値パターンの更新を確認"
    db:
      query: |
        SELECT
          threshold_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.thresholds
        ORDER BY
          threshold_code ASC;
    test: |
      len(current.rows) == 3
      // リクエストの２つの基準値パターンの名称は変更されたことを確認
      && current.rows[0].threshold_code == "T2014-02-1"
      && current.rows[0].name == "New)一般健診"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].threshold_code == "T2014-02-2"
      && current.rows[1].name == "New)職員健診"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      // リクエストに存在しない基準値パターンの名称は変更されないことを確認
      && current.rows[2].threshold_code == "T2014-02-3"
      && current.rows[2].name == "日帰りドック"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == "20250101"
      && current.rows[2].created_by == "ec2014"