desc: EC2014-90 基準値パターンの登録負荷テスト
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  recordCount: 10000
steps:
  clearTable:
    desc: "基準値パターンテーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.thresholds CASCADE;
  createUniqueKeys:
    desc: "ユニークなキーの作成"
    db:
      query: |
        WITH RECURSIVE numbers AS (
          SELECT 1 AS num
          UNION ALL
          SELECT num + 1
          FROM numbers
          WHERE num < {{ vars.recordCount}}
        )
        SELECT
          'Code-' || num AS code
        FROM
          numbers;
    bind:
      uniqueCode: current.rows
  createRequest:
    desc: "リクエストデータの作成"
    loop:
      count: vars.recordCount
    bind:
      requestBody:
        -
          code: uniqueCode[i].code
          name: "'負荷テスト_基準値パターン'"
          inputNote: "'2014-90'"
  startBatch:
    desc: "処理の開始時間"
    bind:
      startTime: now()
  post:
    desc: "基準値パターンの登録"
    req:
      /api/v1/external/thresholds:
        post:
          body:
            application/json:
              "{{ requestBody }}"
    test: |
      current.res.status == 200
    bind:
      endTime: now()
  endBatch:
    desc: "処理の終了時間"
    bind:
      timeKeeper:
        startTime: startTime.Format("2006-01-02T15:04:05Z07:00")
        endTime: endTime.Format("2006-01-02T15:04:05Z07:00")
        interval: endTime.Sub(startTime).Seconds() 
  confirmThresholds:
    desc: "基準値パターンの登録を確認"
    db:
      query: |
        SELECT
          threshold_code
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.thresholds;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].created_at == current.rows[0].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
    dump:
      expr: timeKeeper
      out: ../Dump/EC2014-90.json
