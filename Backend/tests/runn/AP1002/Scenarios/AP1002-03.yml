skipTest: true
desc: AP1002-03 職員取得_存在しない [404]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: true
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path: ../../Helpers/adminAccessToken.yml
  get:
    desc: "職員取得_存在しない"
    req:
      /api/v1/staff/profile:
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 404
    dump:
      expr: current.res.body
      out: ../Dump/AP1002-03.json
