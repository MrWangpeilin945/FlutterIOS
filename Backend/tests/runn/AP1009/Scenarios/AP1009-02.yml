desc: AP1009-02 結果入力情報取得_必須パラメータ不足 [400]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: true
    skipValidateResponse: true
vars:
  consultNumber: "0001"
  examMenuId: 1
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  get:
    desc: "結果入力情報取得_必須パラメータ不足"
    req:
      /api/v1/consult/{{ vars.consultNumber }}/inputExamItems:
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 400
    dump:
      expr: current.res.body
      out: ../Dump/AP1009-02.json
