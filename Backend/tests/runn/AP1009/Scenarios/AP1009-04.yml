desc: AP1009-04 結果入力情報取得_指定した受診が存在しない [404]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  get:
    desc: "結果入力情報取得_指定した受診が存在しない"
    req:
      /api/v1/consult/{consultNumber}/inputExamItems:
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 404
    dump:
      expr: current.res.body
      out: ../Dump/AP1009-04.json

