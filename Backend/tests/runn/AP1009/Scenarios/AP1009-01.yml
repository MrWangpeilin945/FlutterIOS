desc: AP1009-01 結果入力情報取得_正常 [200]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  consultNumber: "0001"
  examMenuId: 1
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  get:
    desc: "結果入力情報取得_正常"
    req:
      /api/v1/consult/{{ vars.consultNumber }}/inputExamItems?examMenuId={{ vars.examMenuId }}:
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 200
    dump:
      expr: current.res.body
      out: ../Dump/AP1009-01.json
