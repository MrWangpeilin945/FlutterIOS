desc: AP1009-03 結果入力情報取得_無効なアクセストークン [401]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: true
steps:
  get:
    desc: "結果入力情報取得_無効なアクセストークン"
    req:
      /api/v1/consult/{consultNumber}/inputExamItems:
        get:
          headers:
            Authorization: "Bearer invalidToken"
    test: |
      current.res.status == 401
    dump:
      expr: current.res.body
      out: ../Dump/AP1009-03.json
