desc: EC2001-01 受診者を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2001-01.json"
steps:
  clearTable:
    desc: "関連テーブルのクリア"
    db:
      query: |
        -- 受診者
        TRUNCATE TABLE resultcollector.examinees CASCADE;
        -- 団体
        TRUNCATE TABLE resultcollector.organizations CASCADE;
  insertData:
    desc: "団体テーブルに実行前データを登録"
    db:
      query: |
        INSERT INTO
          resultcollector.organizations
          (organization_id, organization_code, name, order_number, created_at, created_by)
        VALUES('a0002001-0000-0000-0001-000000000001', 'ORG2001-01', '株式会社岡山', 11, CURRENT_TIMESTAMP,'ec2001')
        ,     ('a0002001-0000-0000-0001-000000000002', 'ORG2001-02', '株式会社倉敷', 12, CURRENT_TIMESTAMP,'ec2001')
        ,     ('a0002001-0000-0000-0001-000000000003', 'ORG2001-03', '株式会社津山', 13, CURRENT_TIMESTAMP,'ec2001');      
  post:
    desc: "受診者を登録_正常"
    req:
      /api/v1/external/examinees:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // レスポンスにErrorObjectが返されないことを確認
      && current.res.body == null
  confirmExaminees:
    desc: "受診者の登録を確認"
    db:
      query: |
        SELECT
          examinee_id::text
          , examinee_code
          , name
          , kana_name
          , sex
          , to_char(birthdate, 'yyyymmdd') as birthdate
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.examinees
        ORDER BY
          examinee_code ASC;
    test: |
      // リクエストの２名の受診者が追加されたことを確認
      len(current.rows) == 2
      && current.rows[0].examinee_code == "EC2001011"
      && current.rows[0].name == "岡山　一郎"
      && current.rows[0].kana_name == "オカヤマ　イチロウ"
      && current.rows[0].sex == 1
      && current.rows[0].birthdate == "19700505"
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"

      && current.rows[1].examinee_code == "EC2001012"
      && current.rows[1].name == "岡山　花子"
      && current.rows[1].kana_name == "オカヤマ　ハナコ"
      && current.rows[1].sex == 2
      && current.rows[1].birthdate == "19851224"
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
    bind:
      entryExaminees: current.rows
  confirmAffiliations:
    desc: "所属の登録を確認"
    db:
      query: |
        SELECT
          a.examinee_id::text
          , a.organization_id::text
          , e.examinee_code
          , o.organization_code
          , to_char(a.created_at, 'yyyymmdd') as created_at
          , a.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.affiliations a
        LEFT JOIN
          resultcollector.examinees e
            on a.examinee_id = e.examinee_id
        LEFT JOIN
          resultcollector.organizations o
            on a.organization_id = o.organization_id
        ORDER BY
          e.examinee_code ASC
          , o.organization_code ASC
    test: |
      // ４件の所属レコードを確認
      len(current.rows) == 4
      && current.rows[0].examinee_code == "EC2001011"
      && current.rows[0].examinee_id == entryExaminees[0].examinee_id
      && current.rows[0].organization_code == "ORG2001-01"
      && current.rows[0].organization_id == "a0002001-0000-0000-0001-000000000001"
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"

      && current.rows[1].examinee_code == "EC2001012"
      && current.rows[1].examinee_id == entryExaminees[1].examinee_id
      && current.rows[1].organization_code == "ORG2001-01"
      && current.rows[1].organization_id == "a0002001-0000-0000-0001-000000000001"
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"

      && current.rows[2].examinee_code == "EC2001012"
      && current.rows[2].examinee_id == entryExaminees[1].examinee_id
      && current.rows[2].organization_code == "ORG2001-02"
      && current.rows[2].organization_id == "a0002001-0000-0000-0001-000000000002"
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"

      && current.rows[3].examinee_code == "EC2001012"
      && current.rows[3].examinee_id == entryExaminees[1].examinee_id
      && current.rows[3].organization_code == "ORG2001-03"
      && current.rows[3].organization_id == "a0002001-0000-0000-0001-000000000003"
      && current.rows[3].created_at == current.rows[3].now
      && current.rows[3].created_by == "ExternalConnection"
