desc: EC2001-04 除外されてないものは追加更新_正常
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2001-04.json"
steps:
  clearTable:
    desc: "関連テーブルのクリア"
    db:
      query: |
        -- 受診者
        TRUNCATE TABLE resultcollector.examinees CASCADE;
        -- 団体
        TRUNCATE TABLE resultcollector.organizations CASCADE;
  insertData:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 受診者
        INSERT INTO
          resultcollector.examinees
          (examinee_id, examinee_code, name, kana_name, sex, birthdate, created_at, created_by)
        VALUES('e0002001-0000-0000-0004-000000000001','EC2001041', '笠岡　太郎', 'カサオカ　タロウ', 1, '1978-10-31', '2025-01-01T12:34:56.789', 'ec2001')
        ,     ('e0002001-0000-0000-0004-000000000002','EC2001042', '新見　花子', 'ニイミ　ハナコ', 1, '1984-11-30', '2025-01-01T12:34:56.789', 'ec2001');
        -- 団体
        INSERT INTO
          resultcollector.organizations
          (organization_id, organization_code, name, order_number, created_at, created_by)
        VALUES('a0002001-0000-0000-0004-000000000001', 'ORG2001-41', '株式会社笠岡', 41, CURRENT_TIMESTAMP, 'ec2001')
        ,     ('a0002001-0000-0000-0004-000000000002', 'ORG2001-42', '株式会社井原', 42, CURRENT_TIMESTAMP, 'ec2001')
        ,     ('a0002001-0000-0000-0004-000000000003', 'ORG2001-43', '株式会社高梁', 43, CURRENT_TIMESTAMP, 'ec2001')
        ,     ('a0002001-0000-0000-0004-000000000004', 'ORG2001-44', '株式会社新見', 44, CURRENT_TIMESTAMP, 'ec2001')
        ,     ('a0002001-0000-0000-0004-000000000005', 'ORG2001-45', '株式会社玉野', 45, CURRENT_TIMESTAMP, 'ec2001');
        -- 所属
        INSERT INTO
          resultcollector.affiliations
          (examinee_id, organization_id, created_at, created_by)
        VALUES('e0002001-0000-0000-0004-000000000001','a0002001-0000-0000-0004-000000000001', '2025-01-01T12:34:56.789', 'ec2001')
        ,     ('e0002001-0000-0000-0004-000000000001','a0002001-0000-0000-0004-000000000004', '2025-01-01T12:34:56.789', 'ec2001')
        ,     ('e0002001-0000-0000-0004-000000000002','a0002001-0000-0000-0004-000000000005', '2025-01-01T12:34:56.789', 'ec2001');
  getExaminees:
    desc: "受診者情報の取得"
    db:
      query: |
        SELECT
          examinee_id::text
          , examinee_code
          , name
          , kana_name
          , sex
          , to_char(birthdate, 'yyyymmdd') as birthdate
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
        FROM
          resultcollector.examinees
        ORDER BY
          examinee_code ASC
    bind:
      examineesData: current.rows
  getAffiliations:
    desc: "所属情報の取得"
    db:
      query: |
        SELECT
          a.examinee_id::text
          , a.organization_id::text
          , e.examinee_code
          , o.organization_code
          , to_char(a.created_at, 'yyyymmdd') as created_at
          , a.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.affiliations a
        LEFT JOIN
          resultcollector.examinees e
            on a.examinee_id = e.examinee_id
        LEFT JOIN
          resultcollector.organizations o
            on a.organization_id = o.organization_id
        ORDER BY
          e.examinee_code ASC
          , o.organization_code ASC
    bind:
      affiliationsData: current.rows
  post:
    desc: "除外されてないものは追加更新_正常"
    req:
      /api/v1/external/examinees:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      // レスポンスに1件のErrorObjectが返されることを確認
      && len(current.res.body) == 11
      && current.res.body[0].code == "10004"
      && current.res.body[0].inputNote == "2001044"
      && current.res.body[0].message == "必須項目が不足しています。ExamineeCode"
      && current.res.body[1].code == "10004"
      && current.res.body[1].inputNote == "2001044"
      && current.res.body[1].message == "必須項目が不足しています。Name"
      && current.res.body[2].code == "10004"
      && current.res.body[2].inputNote == "2001044"
      && current.res.body[2].message == "必須項目が不足しています。KanaName"
      && current.res.body[3].code == "10004"
      && current.res.body[3].inputNote == "2001044"
      && current.res.body[3].message == "必須項目が不足しています。Affiliations.OrganizationCode"
      && current.res.body[4].code == "10003"
      && current.res.body[4].inputNote == "2001045"
      && current.res.body[4].message == "キー項目が重複しています。ExamineeCode:EC2001999"
      && current.res.body[5].code == "10003"
      && current.res.body[5].inputNote == "2001046"
      && current.res.body[5].message == "キー項目が重複しています。ExamineeCode:EC2001999"
      && current.res.body[6].code == "10003"
      && current.res.body[6].inputNote == "2001046"
      && current.res.body[6].message == "キー項目が重複しています。Affiliations.OrganizationCode:ORG2001-41"
      && current.res.body[7].code == "10003"
      && current.res.body[7].inputNote == "2001046"
      && current.res.body[7].message == "キー項目が重複しています。Affiliations.OrganizationCode:ORG2001-43"
      && current.res.body[8].code == "10003"
      && current.res.body[8].inputNote == "2001046"
      && current.res.body[8].message == "キー項目が重複しています。Affiliations.OrganizationCode:ORG2001-42"
      && current.res.body[9].code == "10001"
      && current.res.body[9].inputNote == "2001041"
      && current.res.body[9].message == "指定されたOrganizationCodeがシステム上に存在しません。Code:ORG2001-99"
      && current.res.body[10].code == "10001"
      && current.res.body[10].inputNote == "2001044"
      && current.res.body[10].message == "指定されたOrganizationCodeがシステム上に存在しません。Code:"
    dump:
      expr: current.res.body
      out: ../Dump/EC2001-04.json
  confirmExaminees:
    desc: "除外されてない受診者が追加更新登録されているかを確認"
    db:
      query: |
        SELECT
          examinee_id::text
          , examinee_code
          , name
          , kana_name
          , sex
          , to_char(birthdate, 'yyyymmdd') as birthdate
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.examinees
        ORDER BY
          examinee_code ASC;
    bind:
      entryExaminees: current.rows
    test: |
      // 受診者情報が登録されたことを確認
      len(current.rows) == 3
      // 更新（"inputNote": "2001042" examinee_code=EC2001041：笠岡　太郎）
      && current.rows[0].examinee_code == "EC2001041"
      && current.rows[0].examinee_id == examineesData[0].examinee_id
      // 氏名が変更されていることを確認
      && current.rows[0].name == "笠岡　一二三"
      // カナ氏名が変更されていることを確認
      && current.rows[0].kana_name == "カサオカ　ヒフミ"
      // 生年月日が変更されていることを確認
      && current.rows[0].birthdate == "19851010"
      // 性別が変更されていないことを確認
      && current.rows[0].sex == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"

      // リクエストに含まれないので変更がないことを確認（examinee_code=EC2001042：新見　花子）
      && current.rows[1].examinee_id == examineesData[1].examinee_id
      && current.rows[1].examinee_code == examineesData[1].examinee_code
      && current.rows[1].name == examineesData[1].name
      && current.rows[1].kana_name == examineesData[1].kana_name
      && current.rows[1].birthdate == examineesData[1].birthdate
      && current.rows[1].sex == examineesData[1].sex
      && current.rows[1].created_at == examineesData[1].created_at
      && current.rows[1].created_by == examineesData[1].created_by

      // 新規登録（"inputNote": "2001043"）
      && current.rows[2].examinee_code == "EC2001043"
      && current.rows[2].name == "岡山　太郎"
      && current.rows[2].kana_name == "オカヤマ　タロウ"
      && current.rows[2].birthdate == "19740912"
      && current.rows[2].sex == 1
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"
  confirmAffiliations:
    desc: "所属の更新を確認"
    db:
      query: |
        SELECT
          a.examinee_id::text
          , a.organization_id::text
          , e.examinee_code
          , o.organization_code
          , to_char(a.created_at, 'yyyymmdd') as created_at
          , a.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.affiliations a
        LEFT JOIN
          resultcollector.examinees e
            on a.examinee_id = e.examinee_id
        LEFT JOIN
          resultcollector.organizations o
            on a.organization_id = o.organization_id
        ORDER BY
          e.examinee_code ASC
          , o.organization_code ASC
    test: |
      // ２件の所属レコードを確認
      len(current.rows) == 3
      // リクエストの受診者の所属情報が洗い替えされたことを確認（"inputNote": "2001042"）
      && current.rows[0].examinee_code == "EC2001041"
      && current.rows[0].examinee_id == entryExaminees[0].examinee_id
      && current.rows[0].organization_code == "ORG2001-42"
      && current.rows[0].organization_id == "a0002001-0000-0000-0004-000000000002"
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"

      // リクエストに存在しない受診者の所属情報は変更されないことを確認
      && current.rows[1].examinee_code == "EC2001042"
      && current.rows[1].examinee_id == entryExaminees[1].examinee_id
      && current.rows[1].organization_code == affiliationsData[2].organization_code
      && current.rows[1].organization_id == affiliationsData[2].organization_id
      && current.rows[1].created_at == affiliationsData[2].created_at
      && current.rows[1].created_by == affiliationsData[2].created_by

      // リクエストに受診者の所属情報が追加されたことを確認（"inputNote": "2001043"）
      && current.rows[2].examinee_code == "EC2001043"
      && current.rows[2].examinee_id == entryExaminees[2].examinee_id
      && current.rows[2].organization_code == "ORG2001-43"
      && current.rows[2].organization_id == "a0002001-0000-0000-0004-000000000003"
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"
