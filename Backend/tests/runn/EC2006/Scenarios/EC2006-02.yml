desc: EC2006-02 班を更新_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2006-02.json"
steps:
  clearTable:
    desc: "班テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.teams CASCADE;
  insertData:
    desc: "班テーブルに実行前データを登録"
    db: 
      query: |
        insert into resultcollector.teams (team_code, name , order_number , created_at, created_by)
            values('T2006-02-1', '旧１班', 1, '2025-01-01T12:34:56.789', 'ec2006')
            ,     ('T2006-02-2', '旧２班', 2, '2025-01-01T12:34:56.789', 'ec2006')
            ,     ('T2006-02-3', '旧３班', 3, '2025-01-01T12:34:56.789', 'ec2006');
  post:
    desc: "班を更新_正常"
    req:
      /api/v1/external/teams:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // レスポンスにErrorObjectが返されないことを確認
      && current.res.body == null
  confirmTeams:
    desc: "班の更新を確認"
    db:
      query: |
        SELECT
          team_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.teams
        ORDER BY
          team_code ASC;
    test: |
      len(current.rows) == 3
      // リクエストの２つの班の名称は変更されたことを確認
      && current.rows[0].team_code == "T2006-02-1"
      && current.rows[0].name == "新１班"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].team_code == "T2006-02-2"
      && current.rows[1].name == "新２班"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      // リクエストに存在しない班の名称は変更されないことを確認
      && current.rows[2].team_code == "T2006-02-3"
      && current.rows[2].name == "旧３班"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == "20250101"
      && current.rows[2].created_by == "ec2006"