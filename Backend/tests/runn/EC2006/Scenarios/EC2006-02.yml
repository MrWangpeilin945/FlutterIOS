desc: EC2006-01 班を更新_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  consultNumber: "0001"
  request: "json://../Requests/EC2006-02.json"
steps:
  post:
    desc: "班を登録_更新"
    req:
      /api/v1/external/teams:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
  confirmTeams:
    desc: "班の更新を確認"
    db:
      query: |
        SELECT
          team_code, name
        FROM
          resultcollector.teams
        WHERE
          team_code in ('T241001', 'T241002')
        ORDER BY
          team_code ASC;
    test: |
      len(current.rows) == 2
      && current.rows[0].name == "新１班"
      && current.rows[1].name == "新２班"
