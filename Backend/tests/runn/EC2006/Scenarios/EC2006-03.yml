desc: EC2006-03 キー重複を除外_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2006-03.json"
  errorMessage: "キー項目が重複しています。Code:"
steps:
  clearTable:
    desc: "班テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.teams CASCADE;
  insertData:
    desc: "班テーブルに実行前データを登録"
    db: 
      query: |
        insert into resultcollector.teams (team_code, name , order_number , created_at, created_by) 
            values('T2006-02-1', '旧１班', 1, CURRENT_TIMESTAMP, 'ec2006') 
            ,     ('T2006-02-2', '旧２班', 2, CURRENT_TIMESTAMP, 'ec2006');
  post:
    desc: "班を更新_正常"
    req:
      /api/v1/external/teams:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && len(current.res.body) == 2
      // ログインIDがErrorObjectで返される
      && current.res.body[0].code == "10003"
      && current.res.body[0].inputNote == "20060202A"
      && current.res.body[0].message startsWith vars.errorMessage
      && current.res.body[1].code == "10003"
      && current.res.body[1].inputNote == "20060202B"
      && current.res.body[1].message startsWith vars.errorMessage
  confirmTeams:
    desc: "班の更新を確認"
    db:
      query: |
        SELECT
          team_code, name
        FROM
          resultcollector.teams
        WHERE
          team_code in ('T2006-02-1', 'T2006-02-2')
        ORDER BY
          team_code ASC;
    test: |
      len(current.rows) == 2
      // リクエストの２つの班の名称は変更されたことを確認
      && current.rows[0].team_code == "T2006-02-1"
      && current.rows[0].name == "新１班"
      // 除外された班の名称は変更されないことを確認
      && current.rows[1].team_code == "T2006-02-2"
      && current.rows[1].name == "旧２班"
