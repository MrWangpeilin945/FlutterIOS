desc: EC2006-01 班を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2006-01.json"
steps:
  clearTable:
    desc: "班テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.teams CASCADE;
  post:
    desc: "班を登録_正常"
    req:
      /api/v1/external/teams:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && current.res.body == null
  confirmTeams:
    desc: "班の登録を確認"
    db:
      query: |
        SELECT
          team_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.teams
        ORDER BY
          team_code ASC;
    test: |
      // リクエストの３つの班が追加されたことを確認
      len(current.rows) == 3
      && current.rows[0].team_code == "T2006-01-1"
      && current.rows[0].name == "１班"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].team_code == "T2006-01-2"
      && current.rows[1].name == "２班"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      && current.rows[2].team_code == "T2006-01-3"
      && current.rows[2].name == "３班"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"