desc: EC2006-99 班の負荷テスト
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2006-90.json"
  recordCount: 10000
steps:
  clearTable:
    desc: "班テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.teams CASCADE;
    dump: "'班テーブルをクリア'"
  startBatch:
    desc: "処理の開始時間"
    bind:
      startTime: now()
    dump: now()
  post:
    desc: "班の登録"
    req:
      /api/v1/external/teams:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && current.res.body == null
    dump: now()
  endBatch:
    desc: "処理の終了時間（秒）"
    dump:
      expr: now().Sub(startTime).Seconds() 
      out: ../Dump/EC2006-90.json
  confirmTeams:
    desc: "班の更新を確認"
    db:
      query: |
        SELECT
          team_code
        FROM
          resultcollector.teams;
    test: |
      len(current.rows) == vars.recordCount
