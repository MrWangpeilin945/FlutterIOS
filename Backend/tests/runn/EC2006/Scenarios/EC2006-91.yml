desc: EC2006-91 班の更新負荷テスト
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  recordCount: 10000
steps:
  clearTable:
    desc: "班テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.teams CASCADE;
  createUniqueKeys:
    desc: "ユニークなキーの作成"
    db:
      query: |
        WITH RECURSIVE numbers AS (
          SELECT 1 AS num
          UNION ALL
          SELECT num + 1
          FROM numbers
          WHERE num < {{ vars.recordCount}}
        )
        SELECT
          'Code-' || lpad(cast(num as character varying), 6, '0') AS code
        FROM
          numbers;
    bind:
      uniqueCode: current.rows
  insertData:
    desc: "班テーブルに実行前データを登録"
    loop: vars.recordCount
    db: 
      query: |
        INSERT INTO
          resultcollector.teams (team_code, name , order_number , created_at, created_by)
        VALUES
          (
            '{{ uniqueCode[i].code }}' 
            , '負荷テスト_旧班名称'
            , {{ i + 1 }}
            , '2025-01-01T12:34:56.789'
            , 'ec2006'
          );
  createRequest:
    desc: "リクエストデータの作成"
    loop:
      count: vars.recordCount
    bind:
      requestBody:
        -
          code: uniqueCode[i].code
          name: "'負荷テスト_新班名称'"
          inputNote: "'2006-91'"
  startBatch:
    desc: "処理の開始時間"
    bind:
      startTime: now()
  post:
    desc: "班の更新"
    req:
      /api/v1/external/teams:
        post:
          body:
            application/json:
              "{{ requestBody }}"
    test: |
      current.res.status == 200
    bind:
      endTime: now()
  endBatch:
    desc: "処理の終了時間"
    bind:
      timeKeeper:
        startTime: startTime.Format("2006-01-02T15:04:05Z07:00")
        endTime: endTime.Format("2006-01-02T15:04:05Z07:00")
        interval: endTime.Sub(startTime).Seconds() 
  confirmTeams:
    desc: "班の更新を確認"
    db:
      query: |
        SELECT
          team_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.teams
        ORDER BY
          order_number;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].name == "負荷テスト_新班名称"
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].name == "負荷テスト_新班名称"
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
    dump:
      expr: timeKeeper
      out: ../Dump/EC2006-91.json
