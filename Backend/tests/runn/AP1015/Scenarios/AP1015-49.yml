desc: AP1015-49 進捗取得_なし(依頼:なし / 結果:なし / 中止:なし)
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  placeScheduleId: "00001015-0000-0000-0000-000000000047"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path: ../../Helpers/adminAccessToken.yml
  get:
    desc: "進捗取得_なし(依頼:なし / 結果:なし / 中止:なし)"
    req:
      "/api/v1/progress/{{ vars.placeScheduleId }}":
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 200
      && len(current.res.body.progress) == 0
    dump:
      expr: current.res.body
      out: ../Dump/AP1015-49.json