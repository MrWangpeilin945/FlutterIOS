desc: AP1015-05 進捗取得_予定11(結果:Detail2 / 中止:なし)
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  placeScheduleId: "00001015-0000-0000-0000-000000000003"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path: ../../Helpers/adminAccessToken.yml
  get:
    desc: "進捗取得_予定11(結果:Detail2 / 中止:なし)"
    req:
      "/api/v1/progress/{{ vars.placeScheduleId }}":
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 200
      && len(current.res.body.progress) == 1
      // 予定
      && current.res.body.progress[0].details[0].count ==  1
      // 来場
      && current.res.body.progress[0].details[1].count ==  0
      // 済
      && current.res.body.progress[0].details[2].count ==  0
      // 中止
      && current.res.body.progress[0].details[3].count ==  0
    dump:
      expr: current.res.body
      out: ../Dump/AP1015-05.json