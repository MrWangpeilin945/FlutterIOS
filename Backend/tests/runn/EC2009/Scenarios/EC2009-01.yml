desc: EC2009-01 検査基準値範囲を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2009-01.json"
steps:
  post:
    desc: "検査基準値範囲を登録_正常"
    req:
      /api/v1/external/examNormalValueRange:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
    dump:
      expr: current.res.body
      out: ../Dump/EC2009-01.json
  confirmExamNormalValueRange:
    desc: "検査基準値範囲を登録の登録を確認"
    db:
      query: |
        SELECT
          name
          , exam_item_detail_id
          , min_age
          , max_age
          , target_sex
          , min_value::text
          , max_value::text
          , error_level
        FROM
          resultcollector.exam_normal_value_range
        WHERE
          exam_item_detail_id in (20091, 20092, 20093)
        ORDER BY
          exam_item_detail_id ASC;
    test: |
      len(current.rows) == 3
      && current.rows[0].exam_item_detail_id == 20091
      && current.rows[0].name == "白血球数"
      && current.rows[0].min_age == "0400000"
      && current.rows[0].max_age == "0750000"
      && current.rows[0].target_sex == 3
      && current.rows[0].min_value == "3.3"
      && current.rows[0].max_value == "8.6"
      && current.rows[0].error_level == 1
      && current.rows[1].exam_item_detail_id == 20092
      && current.rows[1].name == "赤血球数"
      && current.rows[1].min_age == "0400000"
      && current.rows[1].max_age == "0750000"
      && current.rows[1].target_sex == 1
      && current.rows[1].min_value == "4.35"
      && current.rows[1].max_value == "5.55"
      && current.rows[1].error_level == 1
      && current.rows[2].exam_item_detail_id == 20093
      && current.rows[2].name == "血小板数"
      && current.rows[2].min_age == "0400000"
      && current.rows[2].max_age == "0750000"
      && current.rows[2].target_sex == 2
      && current.rows[2].min_value == "13.0"
      && current.rows[2].max_value == "36.9"
      && current.rows[2].error_level == 1
