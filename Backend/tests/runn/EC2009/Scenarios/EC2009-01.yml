desc: EC2009-01 検査基準値範囲を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2009-01.json"
steps:
  clearTable:
    desc: "関連テーブルのクリア"
    db:
      query: |
        -- 基準値パターン
        TRUNCATE TABLE resultcollector.thresholds CASCADE;
        -- 検査基準値範囲
        TRUNCATE TABLE resultcollector.exam_normal_value_range CASCADE;
        -- 外部検査項目明細
        TRUNCATE TABLE resultcollector.external_exam_item_details CASCADE;
        -- 検査メニュー
        TRUNCATE TABLE resultcollector.exam_menus CASCADE;
  insertExamMenus:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 検査メニュー
        INSERT INTO
          resultcollector.exam_menus
          (exam_menu_id, name, order_number, enabled, created_at, created_by)
        VALUES(2009, '血液検査', 2009, true, CURRENT_TIMESTAMP,'ec2009');
        -- 検査項目グループ
        INSERT INTO
          resultcollector.exam_item_groups
          (exam_item_group_id, name, exam_menu_id, type, order_number, created_at, created_by)
        VALUES(2009, '血液検査', 2009, 1, 1, CURRENT_TIMESTAMP,'ec2009');
        -- 検査項目
        INSERT INTO
          resultcollector.exam_items
          (exam_item_id, name, exam_item_group_id, position_number, unit, order_number, created_at, created_by)
        VALUES(20091, '白血球数', 2009, 1, '1000/ul',1, CURRENT_TIMESTAMP,'ec2009')
        ,     (20092, '赤血球数', 2009, 2, '1000000/ul',2, CURRENT_TIMESTAMP,'ec2009')
        ,     (20093, '血小板数', 2009, 3, '1000/ul',3, CURRENT_TIMESTAMP,'ec2009');
        -- 検査項目明細
        INSERT INTO
          resultcollector.exam_item_details
          (exam_item_detail_id, exam_item_id, name, order_number, position_number, type, keyboard_type, integer_length, decimal_length, equipment_label, created_at, created_by)
        VALUES(20091, 20091, '白血球数', 1, 1, 1, 1, 3, 2, null, CURRENT_TIMESTAMP,'ec2009')
        ,     (20092, 20092, '赤血球数', 2, 2, 1, 1, 3, 2, null, CURRENT_TIMESTAMP,'ec2009')
        ,     (20093, 20093, '血小板数', 3, 3, 1, 1, 3, 2, null, CURRENT_TIMESTAMP,'ec2009');
        -- 外部検査項目明細
        INSERT INTO
          resultcollector.external_exam_item_details
          (exam_item_detail_id, external_exam_item_detail_code, created_at, created_by)
        VALUES(20091, 'EC2009WBC', CURRENT_TIMESTAMP,'ec2009')
        ,     (20092, 'EC2009RBC', CURRENT_TIMESTAMP,'ec2009')
        ,     (20093, 'EC2009PLT', CURRENT_TIMESTAMP,'ec2009');
        -- 基準値パターン
        INSERT INTO
          resultcollector.thresholds
          (threshold_id, threshold_code, name, order_number, created_at, created_by)
        VALUES('e0002009-0000-0000-0000-000000000001', 'EC2009', 'EC2009血液検査', 1, CURRENT_TIMESTAMP,'ec2009');
  post:
    desc: "検査基準値範囲を登録_正常"
    req:
      /api/v1/external/examNormalValueRange:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
    dump:
      expr: current.res.body
      out: ../Dump/EC2009-01.json
  confirmExamNormalValueRange:
    desc: "検査基準値範囲を登録の登録を確認"
    db:
      query: |
        SELECT
          name
          , exam_item_detail_id
          , min_age
          , max_age
          , target_sex
          , min_value::text
          , max_value::text
          , error_level
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.exam_normal_value_range
        WHERE
          exam_item_detail_id in (20091, 20092, 20093)
        ORDER BY
          exam_item_detail_id ASC;
    test: |
      len(current.rows) == 3
      && current.rows[0].exam_item_detail_id == 20091
      && current.rows[0].name == "白血球数"
      && current.rows[0].min_age == "0400000"
      && current.rows[0].max_age == "0750000"
      && current.rows[0].target_sex == 3
      && current.rows[0].min_value == "3.3"
      && current.rows[0].max_value == "8.6"
      && current.rows[0].error_level == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].exam_item_detail_id == 20092
      && current.rows[1].name == "赤血球数"
      && current.rows[1].min_age == "0400000"
      && current.rows[1].max_age == "0750000"
      && current.rows[1].target_sex == 1
      && current.rows[1].min_value == "4.35"
      && current.rows[1].max_value == "5.55"
      && current.rows[1].error_level == 1
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      && current.rows[2].exam_item_detail_id == 20093
      && current.rows[2].name == "血小板数"
      && current.rows[2].min_age == "0400000"
      && current.rows[2].max_age == "0750000"
      && current.rows[2].target_sex == 2
      && current.rows[2].min_value == "13.0"
      && current.rows[2].max_value == "36.9"
      && current.rows[2].error_level == 1
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"