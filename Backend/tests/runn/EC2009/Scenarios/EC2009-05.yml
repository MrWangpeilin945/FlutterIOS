desc: EC2009-05 PKが重複するレコードが存在する
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2009-05.json"
  errorMessage: "キー項目が重複しています。"
steps:
  post:
    desc: "PKが重複するレコードが存在する"
    req:
      /api/v1/external/examNormalValueRange:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // 重複エラーがErrorObjectで返される
      && len(current.res.body) == 2
      && current.res.body[0].code == "10003"
      && current.res.body[0].inputNote == "2009051"
      && current.res.body[0].message startsWith vars.errorMessage
      && current.res.body[1].code == "10003"
      && current.res.body[1].inputNote == "2009052"
      && current.res.body[1].message startsWith vars.errorMessage
    dump:
      expr: current.res.body
      out: ../Dump/EC2009-05.json
