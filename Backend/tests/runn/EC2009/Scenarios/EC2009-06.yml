desc: EC2009-06 基準値パターン・検査項目明細IDが取得できない
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2009-06.json"
steps:
  clearTable:
    desc: "検査基準値範囲テーブルのクリア"
    db:
      query: |
      query: |
        -- 基準値パターン
        TRUNCATE TABLE resultcollector.thresholds CASCADE;
        -- 検査基準値範囲
        TRUNCATE TABLE resultcollector.exam_normal_value_range CASCADE;
        -- 外部検査項目明細
        TRUNCATE TABLE resultcollector.external_exam_item_details CASCADE;
        -- 検査メニュー
        TRUNCATE TABLE resultcollector.exam_menus CASCADE;
  post:
    desc: "基準値パターン・検査項目明細IDが取得できない"
    req:
      /api/v1/external/examNormalValueRange:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 2
      // 基準値パターンCDエラーがErrorObjectで返される
      && current.res.body[0].code == "10001"
      && current.res.body[0].inputNote == "2009061"
      && current.res.body[0].message == "指定されたThresholdCodeがシステム上に存在しません。Code:Dummy2009"
      // 検査項目明細CDエラーがErrorObjectで返される
      && current.res.body[1].code == "10001"
      && current.res.body[1].inputNote == "2009061"
      && current.res.body[1].message == "指定されたExamItemDetailCodeがシステム上に存在しません。Code:Dummy2009WBC"
    dump:
      expr: current.res.body
      out: ../Dump/EC2009-06.json
  confirmExamNormalValueRange:
    desc: "検査基準値範囲の登録を確認"
    db:
      query: |
        SELECT
          range_id::text
        FROM
          resultcollector.exam_normal_value_range
    test: |
      // 検査基準値範囲が登録されていないことを確認
      len(current.rows) == 0
