desc: EC2009-03 基準値パターンが取得できない
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2009-03.json"
  errorMessage: "指定されたThresholdCdがシステム上に存在しません。Code:Dummy2009"
steps:
  post:
    desc: "基準値パターンが取得できない"
    req:
      /api/v1/external/examNormalValueRange:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // 基準値パターンエラーがErrorObjectで返される
      && current.res.body[0].code == "10001"
      && current.res.body[0].inputNote == "2009031"
      && current.res.body[0].message == vars.errorMessage
    dump:
      expr: current.res.body
      out: ../Dump/EC2009-03.json
