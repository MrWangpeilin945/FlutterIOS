desc: EC2009-91 検査基準値範囲の登録負荷テスト
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  recordCount: 1000
steps:
  clearTable:
    desc: "関連テーブルをクリア"
    db:
      query: |
        -- 基準値パターン
        TRUNCATE TABLE resultcollector.thresholds CASCADE;
        -- 検査基準値範囲
        TRUNCATE TABLE resultcollector.exam_normal_value_range CASCADE;
        -- 外部検査項目明細
        TRUNCATE TABLE resultcollector.external_exam_item_details CASCADE;
        -- 検査メニュー
        TRUNCATE TABLE resultcollector.exam_menus CASCADE;
  insertTable:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 検査メニュー
        INSERT INTO
          resultcollector.exam_menus
          (exam_menu_id, name, order_number, enabled, created_at, created_by)
        VALUES(2009, '検査メニュー', 2009, true, CURRENT_TIMESTAMP,'ec2009');
        -- 検査項目グループ
        INSERT INTO
          resultcollector.exam_item_groups
          (exam_item_group_id, name, exam_menu_id, type, order_number, created_at, created_by)
        VALUES(2009, '検査項目グループ', 2009, 1, 1, CURRENT_TIMESTAMP,'ec2009');
        -- 検査項目
        INSERT INTO
          resultcollector.exam_items
          (exam_item_id, name, exam_item_group_id, position_number, unit, order_number, created_at, created_by)
        VALUES(2009, '検査項目', 2009, 4, 'g/dL',4, CURRENT_TIMESTAMP,'ec2009');
        -- 基準値パターン
        INSERT INTO
          resultcollector.thresholds
          (threshold_id, threshold_code, name, order_number, created_at, created_by)
        VALUES('e0002009-0000-0000-0091-000000000001', 'Threshold2009', '基準値パターン', 1, CURRENT_TIMESTAMP,'ec2009');
  createUniqueKeys:
    desc: "ユニークな外部検査項目明細と最大値の作成"
    db:
      query: |
        WITH RECURSIVE numbers AS (
          SELECT 1 AS num
          UNION ALL
          SELECT num + 1
          FROM numbers
          WHERE num < {{ vars.recordCount}}
        )
        SELECT
          'E-' || lpad(cast(num as character varying), 6, '0') AS code
          , num AS id
        FROM
          numbers;
    bind:
      uniqueKeys: current.rows
  createExamItemDetails:
    desc: "検査項目明細レコードの作成"
    loop: vars.recordCount
    db: 
      query: |
        INSERT INTO
          resultcollector.exam_item_details
            (exam_item_detail_id, exam_item_id, name, order_number, position_number, type, keyboard_type, integer_length, decimal_length, equipment_label, created_at, created_by)
        VALUES
          (
            {{ uniqueKeys[i].id }}
            , 2009
            , '検査項目明細'
            , {{ uniqueKeys[i].id }}
            , {{ uniqueKeys[i].id }}
            , 1
            , 1
            , 3
            , 1
            , null
            , '2025-01-01T12:34:56.789'
            , 'ec2009'
          );
  createExternalExamItemDetails:
    desc: "外部検査項目明細レコードの作成"
    loop: vars.recordCount
    db: 
      query: |
        INSERT INTO
          resultcollector.external_exam_item_details
            (exam_item_detail_id, external_exam_item_detail_code, created_at, created_by)
        VALUES
          (
            {{ uniqueKeys[i].id }}
            , '{{ uniqueKeys[i].code }}'
            , CURRENT_TIMESTAMP
            , 'ec2009'
          );
  createExamNormalValueRange:
    desc: "検査基準値範囲レコードの作成"
    loop: vars.recordCount
    db: 
      query: |
        INSERT INTO
          resultcollector.exam_normal_value_range
            (name, threshold_id, exam_item_detail_id, min_age, max_age, target_sex, min_value, max_value, error_level, created_at, created_by)
        VALUES
          (
            '負荷テスト_旧検査基準値範囲'
            , 'e0002009-0000-0000-0091-000000000001'
            , {{ uniqueKeys[i].id }}
            , '0000000'
            , '9999999'
            , 3
            , 0
            , 100
            , 1
            , CURRENT_TIMESTAMP
            , 'ec2009'
          );
  createRequest:
    desc: "リクエストデータの作成"
    loop:
      count: vars.recordCount
    bind:
      requestBody:
        -
          name: "'負荷テスト_新検査基準値範囲'"
          thresholdCd: "'Threshold2009'"
          examItemDetailCd: uniqueKeys[i].code
          maxAge: "'0750000'"
          minAge: "'0400000'"
          targetSex: 1
          maxValue: 200
          minValue: 10
          errorLevel: 3
          inputNote: "'2009-91'"
  startBatch:
    desc: "処理の開始時間"
    bind:
      startTime: now()
  post:
    desc: "検査基準値範囲の更新"
    req:
      /api/v1/external/examNormalValueRange:
        post:
          body:
            application/json:
              "{{ requestBody }}"
    test: |
      current.res.status == 200
    bind:
      endTime: now()
  endBatch:
    desc: "処理の終了時間"
    bind:
      timeKeeper:
        startTime: startTime.Format("2006-01-02T15:04:05Z07:00")
        endTime: endTime.Format("2006-01-02T15:04:05Z07:00")
        interval: endTime.Sub(startTime).Seconds() 
  confirmStaffs:
    desc: "検査基準値範囲の更新を確認"
    db:
      query: |
        SELECT
          name
          , threshold_id::text
          , exam_item_detail_id
          , min_age
          , max_age
          , target_sex
          , min_value
          , max_value
          , error_level          
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.exam_normal_value_range
        ORDER BY
          exam_item_detail_id;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].name == "負荷テスト_新検査基準値範囲"
      && current.rows[0].max_age == "0750000"
      && current.rows[0].min_age == "0400000"
      && current.rows[0].target_sex == 1
      && current.rows[0].max_value == 200
      && current.rows[0].min_value == 10
      && current.rows[0].error_level == 3
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].name == "負荷テスト_新検査基準値範囲"
      && current.rows[vars.recordCount - 1].max_age == "0750000"
      && current.rows[vars.recordCount - 1].min_age == "0400000"
      && current.rows[vars.recordCount - 1].target_sex == 1
      && current.rows[vars.recordCount - 1].max_value == 200
      && current.rows[vars.recordCount - 1].min_value == 10
      && current.rows[vars.recordCount - 1].error_level == 3
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
    dump:
      expr: timeKeeper
      out: ../Dump/EC2009-91.json