desc: EC2009-09 年齢の形式が一致しない
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2009-09.json"
steps:
  clearTable:
    desc: "検査基準値範囲テーブルのクリア"
    db:
      query: |
        -- 基準値パターン
        TRUNCATE TABLE resultcollector.thresholds CASCADE;
        -- 検査基準値範囲
        TRUNCATE TABLE resultcollector.exam_normal_value_range CASCADE;
        -- 外部検査項目明細
        TRUNCATE TABLE resultcollector.external_exam_item_details CASCADE;
        -- 検査メニュー
        TRUNCATE TABLE resultcollector.exam_menus CASCADE;
  insertExamMenus:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 検査メニュー
        INSERT INTO
          resultcollector.exam_menus
          (exam_menu_id, name, order_number, enabled, created_at, created_by)
        VALUES(2009, '血液検査', 2009, true, CURRENT_TIMESTAMP,'ec2009');
        -- 検査項目グループ
        INSERT INTO
          resultcollector.exam_item_groups
          (exam_item_group_id, name, exam_menu_id, type, order_number, created_at, created_by)
        VALUES(2009, '血液検査', 2009, 1, 1, CURRENT_TIMESTAMP,'ec2009');
        -- 検査項目
        INSERT INTO
          resultcollector.exam_items
          (exam_item_id, name, exam_item_group_id, position_number, unit, order_number, created_at, created_by)
        VALUES(20091, '白血球数', 2009, 1, '1000/ul',1, CURRENT_TIMESTAMP,'ec2009');
        -- 検査項目明細
        INSERT INTO
          resultcollector.exam_item_details
          (exam_item_detail_id, exam_item_id, name, order_number, position_number, type, keyboard_type, integer_length, decimal_length, equipment_label, created_at, created_by)
        VALUES(20091, 20091, '白血球数', 1, 1, 1, 1, 3, 2, null, CURRENT_TIMESTAMP,'ec2009');
        -- 外部検査項目明細
        INSERT INTO
          resultcollector.external_exam_item_details
          (exam_item_detail_id, external_exam_item_detail_code, created_at, created_by)
        VALUES(20091, 'EC2009WBC', CURRENT_TIMESTAMP,'ec2009');
        -- 基準値パターン
        INSERT INTO
          resultcollector.thresholds
          (threshold_id, threshold_code, name, order_number, created_at, created_by)
        VALUES('e0002009-0000-0000-0000-000000000000', 'EC2009', 'EC2009血液検査', 1, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000001', 'EC2009A', 'EC2009血液検査A', 2, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000002', 'EC2009B', 'EC2009血液検査B', 3, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000003', 'EC2009C', 'EC2009血液検査C', 4, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000004', 'EC2009D', 'EC2009血液検査D', 5, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000005', 'EC2009E', 'EC2009血液検査E', 6, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000006', 'EC2009F', 'EC2009血液検査F', 7, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000007', 'EC2009G', 'EC2009血液検査G', 8, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000008', 'EC2009H', 'EC2009血液検査H', 8, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000009', 'EC2009I', 'EC2009血液検査I', 8, CURRENT_TIMESTAMP,'ec2009')
        ,     ('e0002009-0000-0000-0000-000000000010', 'EC2009J', 'EC2009血液検査J', 8, CURRENT_TIMESTAMP,'ec2009');
  post:
    desc: "年齢の形式が一致しない"
    req:
      /api/v1/external/examNormalValueRange:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      // 形式エラーがErrorObjectで返される
      && len(current.res.body) == 7
      && current.res.body[0].code == "10006"
      && current.res.body[0].inputNote == "2009091"
      && current.res.body[0].message == "値の形式が無効です。MinAge:420000"
      && current.res.body[1].code == "10006"
      && current.res.body[1].inputNote == "2009092"
      && current.res.body[1].message == "値の形式が無効です。MinAge:0301200"
      && current.res.body[2].code == "10006"
      && current.res.body[2].inputNote == "2009093"
      && current.res.body[2].message == "値の形式が無効です。MinAge:0301031"
      && current.res.body[3].code == "10006"
      && current.res.body[3].inputNote == "2009094"
      && current.res.body[3].message == "値の形式が無効です。MaxAge:99990000"
      && current.res.body[4].code == "10006"
      && current.res.body[4].inputNote == "2009095"
      && current.res.body[4].message == "値の形式が無効です。MaxAge:9999999"
      && current.res.body[5].code == "10006"
      && current.res.body[5].inputNote == "2009096"
      && current.res.body[5].message == "値の形式が無効です。MaxAge:999A99B9"
      && current.res.body[6].code == "10006"
      && current.res.body[6].inputNote == "2009097"
      && current.res.body[6].message == "値の形式が無効です。MinAge:000000O"
    dump:
      expr: current.res.body
      out: ../Dump/EC2009-09.json
  confirmExamNormalValueRange:
    desc: "検査基準値範囲を登録の登録を確認"
    db:
      query: |
        SELECT
          e.threshold_id::text
          , t.threshold_code
          , e.name
          , e.exam_item_detail_id
          , e.min_age
          , e.max_age
          , e.target_sex
          , e.min_value::text
          , e.max_value::text
          , e.error_level
          , to_char(e.created_at, 'yyyymmdd') as created_at
          , e.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.exam_normal_value_range e
        LEFT JOIN
          resultcollector.thresholds t
            on t.threshold_id = e.threshold_id
        ORDER BY
          e.exam_item_detail_id ASC;
    test: |
      len(current.rows) == 10
      && current.rows[0].name == "上限年齢が月齢が01・日齢が00"
      && current.rows[0].threshold_id == "e0002009-0000-0000-0000-000000000001"
