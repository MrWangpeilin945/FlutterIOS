desc: EC2012-08 キー重複を除外_正常 [207]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2012-08.json"
steps:
  clearTable:
    desc: "基準値パターンテーブルをクリア"
    db:
      query: |
        -- 会場
        TRUNCATE TABLE resultcollector.places CASCADE; 
        -- 班
        TRUNCATE TABLE resultcollector.teams CASCADE;
  insertData:
    desc: "基準値パターンテーブルに実行前データを登録"
    db: 
      query: |
             -- 班
             insert into resultcollector.teams (team_id, team_code, name, order_number, created_at, created_by)
                 values('c0002012-0000-0000-0000-000000000007', 'T2012-07', 'Ⅶ班', 7, '2025-01-01T12:34:56.789', 'ec2012')
                 ,     ('c0002012-0000-0000-0000-000000000008', 'T2012-08', '八班', 8, '2025-01-01T12:34:56.789', 'ec2012');
             -- 会場
             insert into resultcollector.places (place_id, place_code, name, order_number, created_at, created_by)
                 values('e0002012-0000-0000-0000-000000000007', 'P2012-07', '第Ⅶ会場', 7, '2025-01-01T12:34:56.789', 'ec2012')
                 ,     ('e0002012-0000-0000-0000-000000000008', 'P2012-08', '第八会場', 8, '2025-01-01T12:34:56.789', 'ec2012');
  post:
    desc: "会場IDと班IDが取得できない"
    req:
      /api/v1/external/placeSchedules:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 2
      // 会場エラーと班エラーがErrorObjectで返される
      && current.res.body[0].code == "10003"
      && current.res.body[0].inputNote == "201208-01"
      && current.res.body[0].message == "キー項目が重複しています。TeamCode:T2012-08/PlaceCode:P2012-08/ExamDate:2030/03/08 1:01:00"
      && current.res.body[1].code == "10003"
      && current.res.body[1].inputNote == "201208-02"
      && current.res.body[1].message == "キー項目が重複しています。TeamCode:T2012-08/PlaceCode:P2012-08/ExamDate:2030/03/08 2:01:00"
    dump:
      expr: current.res.body
      out: ../Dump/EC2012-08.json
  confirmPlaceSchedule:
    desc: "会場日程が登録されない"
    db:
      query: |
        SELECT
          ps1.place_schedule_id::text
          , ps1.place_id::text
          , p1.place_code
          , ps1.team_id::text
          , t1.team_code
          , status
          , to_char(exam_date, 'yyyymmdd') as examdate
          , start_time
          , concat(ps1.place_id::text, ps1.team_id::text) as placeTeam
          , to_char(ps1.created_at, 'yyyymmdd') as created_at
          , ps1.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.place_schedule ps1
        JOIN
          resultcollector.teams t1
        ON 
          ps1.team_id = t1.team_id
        JOIN
          resultcollector.places p1
        ON 
          ps1.place_id = p1.place_id
        ORDER BY
          exam_date, start_time;
    test: |
      len(current.rows) == 3
      // 重複していない会場日程が追加される
      && current.rows[1].place_id == "e0002012-0000-0000-0000-000000000008"
      && current.rows[1].place_code == "P2012-08"
      && current.rows[1].team_id == "c0002012-0000-0000-0000-000000000007"
      && current.rows[1].team_code == "T2012-07"
      && current.rows[1].examdate == '20300308'
      && current.rows[1].start_time == '0301'
      && current.rows[1].status == 21
      && current.rows[1].created_at == current.rows[0].now
      && current.rows[1].created_by == "ExternalConnection"
      && current.rows[2].place_id == "e0002012-0000-0000-0000-000000000007"
      && current.rows[2].place_code == "P2012-07"
      && current.rows[2].team_id == "c0002012-0000-0000-0000-000000000008"
      && current.rows[2].team_code == "T2012-08"
      && current.rows[2].examdate == '20300308'
      && current.rows[2].start_time == '0401'
      && current.rows[2].status == 21
      && current.rows[2].created_at == current.rows[1].now
      && current.rows[2].created_by == "ExternalConnection"
      && current.rows[0].place_id == "e0002012-0000-0000-0000-000000000008"
      && current.rows[0].place_code == "P2012-08"
      && current.rows[0].team_id == "c0002012-0000-0000-0000-000000000008"
      && current.rows[0].team_code == "T2012-08"
      && current.rows[0].examdate == '20300307'
      && current.rows[0].start_time == '0501'
      && current.rows[0].status == 21
      && current.rows[0].created_at == current.rows[2].now
      && current.rows[0].created_by == "ExternalConnection"
