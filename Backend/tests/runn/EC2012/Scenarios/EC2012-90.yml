desc: EC2012-90 会場日程の登録負荷テスト
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  recordCount: 10000
steps:
  clearTable:
    desc: "会場日程テーブルをクリア"
    db:
      query: |
        TRUNCATE TABLE resultcollector.teams CASCADE;
        TRUNCATE TABLE resultcollector.places CASCADE;
        TRUNCATE TABLE resultcollector.place_schedule CASCADE;
  createTeams:
    desc: "班のレコードを追加"
    db:
      query: |
        INSERT INTO
          resultcollector.teams
            (team_id, team_code, name, order_number, created_at, created_by)
        VALUES
            (
              'c0002012-0000-0000-0090-000000000001'
              , 'T2012-90'
              , 'Ⅰ班'
              , 1
              , CURRENT_TIMESTAMP
              , 'ec2012'
            );
  createPlaces:
    desc: "会場のレコードを追加"
    db:
      query: |
        INSERT INTO
          resultcollector.places
            (place_id, place_code, name, order_number, created_at, created_by)
        VALUES
            (
              'e0002012-0000-0000-0090-000000000001'
              , 'P2012-90'
              , '第Ⅰ会場'
              , 1
              , CURRENT_TIMESTAMP
              , 'ec2012'
            );
  getExamdate:
    desc: "ユニークな健診日の作成"
    db:
      query: |
        WITH RECURSIVE numbers AS (
          SELECT 1 AS num
          UNION ALL
          SELECT num + 1
          FROM numbers
          WHERE num < {{ vars.recordCount}}
        )
        SELECT
          to_char('2025-01-01'::DATE + INTERVAL '1 day' * num ,'YYYY-MM-DDT08:30:00') AS examDate
        FROM
          numbers;
    bind:
      uniqueDate: current.rows
  createRequest:
    desc: "リクエストデータの作成"
    loop:
      count: vars.recordCount
    bind:
      requestBody:
        -
          teamCode: "'T2012-90'"
          placeCode: "'P2012-90'"
          examDate: uniqueDate[i].examdate
          inputNote: "'2012-90'"
  startBatch:
    desc: "処理の開始時間"
    bind:
      startTime: now()
  post:
    desc: "会場日程の登録"
    req:
      /api/v1/external/placeSchedules:
        post:
          body:
            application/json:
              "{{ requestBody }}"
    test: |
      current.res.status == 200
    bind:
      endTime: now()
  endBatch:
    desc: "処理の終了時間"
    bind:
      timeKeeper:
        startTime: startTime.Format("2006-01-02T15:04:05Z07:00")
        endTime: endTime.Format("2006-01-02T15:04:05Z07:00")
        interval: endTime.Sub(startTime).Seconds() 
  confirmPlaceSchedules:
    desc: "会場日程の登録を確認"
    db:
      query: |
        SELECT
          place_schedule_id::text
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.place_schedule;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].created_at == current.rows[0].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
    dump:
      expr: timeKeeper
      out: ../Dump/EC2012-90.json
