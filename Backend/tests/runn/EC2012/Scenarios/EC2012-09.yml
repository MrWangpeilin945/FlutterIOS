        SELECT
          ps1.place_schedule_id::text
          , ps1.place_id::text
          , p1.place_code
          , ps1.team_id::text
          , t1.team_code
          , status
          , to_char(exam_date, 'yyyymmdd') as examdate
          , start_time
          , concat(ps1.place_id::text, ps1.team_id::text) as placeTeam
          , to_char(ps1.created_at, 'yyyymmdd') as created_at
          , ps1.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.place_schedule ps1
        JOIN
          resultcollector.teams t1
        ON 
          ps1.team_id = t1.team_id
        JOIN
          resultcollector.places p1
        ON 
          ps1.place_id = p1.place_id
        ORDER BY
          exam_date, start_time;
