desc: EC2012-01 会場日程を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2012-01.json"
steps:
  clearTable:
    desc: "基準値パターンテーブルをクリア"
    db:
      query: |
        -- 会場
        TRUNCATE TABLE resultcollector.places CASCADE; 
        -- 班
        TRUNCATE TABLE resultcollector.teams CASCADE;
  insertData:
    desc: "基準値パターンテーブルに実行前データを登録"
    db: 
      query: |
             -- 班
             insert into resultcollector.teams (team_id, team_code, name, order_number, created_at, created_by)
                 values('c0002012-0000-0000-0000-000000000001', 'T2012-01', 'Ⅰ班', 1, '2025-01-01T12:34:56.789', 'ec2012')
                 ,     ('c0002012-0000-0000-0000-000000000002', 'T2012-02', 'Ⅱ班', 2, '2025-01-01T12:34:56.789', 'ec2012');
             -- 会場
             insert into resultcollector.places (place_id, place_code, name, order_number, created_at, created_by)
                 values('e0002012-0000-0000-0000-000000000001', 'P2012-01', '第Ⅰ会場', 1, '2025-01-01T12:34:56.789', 'ec2012')
                 ,     ('e0002012-0000-0000-0000-000000000002', 'P2012-02', '第Ⅱ会場', 2, '2025-01-01T12:34:56.789', 'ec2012');
  post:
    desc: "会場日程を登録_正常"
    req:
      /api/v1/external/placeSchedules:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && current.res.body == null
  confirmPlaceSchedule:
    desc: "会場日程の登録を確認"
    db:
      query: |
        SELECT
          ps1.place_id::text
          , p1.place_code
          , ps1.team_id::text
          , t1.team_code
          , status
          , to_char(exam_date, 'yyyymmdd') as examdate
          , start_time
          , concat(ps1.place_id::text, ps1.team_id::text) as placeTeam
          , to_char(ps1.created_at, 'yyyymmdd') as created_at
          , ps1.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.place_schedule ps1
        JOIN
          resultcollector.teams t1
        ON 
          ps1.team_id = t1.team_id
        JOIN
          resultcollector.places p1
        ON 
          ps1.place_id = p1.place_id
        ORDER BY
          placeTeam ASC;
    test: |
      len(current.rows) == 2
      // 状況は検査中で登録される
      && current.rows[0].place_id == "e0002012-0000-0000-0000-000000000001"
      && current.rows[0].place_code == "P2012-01"
      && current.rows[0].team_id == "c0002012-0000-0000-0000-000000000001"
      && current.rows[0].team_code == "T2012-01"
      && current.rows[0].status == 21
      && current.rows[0].examdate == '20250130'
      && current.rows[0].start_time == '0845'
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      // 状況は検査中で登録される
      && current.rows[1].place_id == "e0002012-0000-0000-0000-000000000002"
      && current.rows[1].place_code == "P2012-02"
      && current.rows[1].team_id == "c0002012-0000-0000-0000-000000000002"
      && current.rows[1].team_code == "T2012-02"
      && current.rows[1].status == 21
      && current.rows[1].examdate == '20250202'
      && current.rows[1].start_time == '0930'
      && current.rows[1].created_at == current.rows[0].now
      && current.rows[1].created_by == "ExternalConnection"