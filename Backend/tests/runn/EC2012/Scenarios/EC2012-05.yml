desc: EC2012-05 班IDが取得できない [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2012-05.json"
  errorMessage: "指定されたPlaceCodeがシステム上に存在しません。"
  examDate: "2030-03-03"
steps:
  post:
    desc: "班IDが取得できない"
    req:
      /api/v1/external/placeSchedules:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && len(current.res.body) == 1
      // 班エラーがErrorObjectで返される
      && current.res.body[0].code == "10001"
      && current.res.body[0].inputNote == "201205"
      && current.res.body[0].message startsWith vars.errorMessage
    dump:
      expr: current.res.body
      out: ../Dump/EC2012-05.json
  confirmPlaceSchedule:
    desc: "会場日程が登録されない"
    db:
      query: |
        SELECT
          exam_date
        FROM
          resultcollector.place_schedule
        WHERE
          exam_date = '{{ vars.examDate }}'
    test: |
      current.rows == null      