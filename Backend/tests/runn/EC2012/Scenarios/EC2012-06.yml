desc: EC2012-06 会場IDと班IDが取得できない [207]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2012-06.json"
steps:
  clearTable:
    desc: "基準値パターンテーブルをクリア"
    db:
      query: |
        -- 会場
        TRUNCATE TABLE resultcollector.places CASCADE; 
        -- 班
        TRUNCATE TABLE resultcollector.teams CASCADE;
  insertData:
    desc: "基準値パターンテーブルに実行前データを登録"
    db: 
      query: |
             -- 班
             insert into resultcollector.teams (team_id, team_code, name, order_number, created_at, created_by)
                 values('c0002012-0000-0000-0000-000000000006', 'T2012-06', 'Ⅵ班', 6, '2025-01-01T12:34:56.789', 'ec2012');
             -- 会場
             insert into resultcollector.places (place_id, place_code, name, order_number, created_at, created_by)
                 values('e0002012-0000-0000-0000-000000000006', 'P2012-06', '第Ⅵ会場', 6, '2025-01-01T12:34:56.789', 'ec2012');
  post:
    desc: "会場IDと班IDが取得できない"
    req:
      /api/v1/external/placeSchedules:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 2
      // 会場エラーと班エラーがErrorObjectで返される
      && current.res.body[0].code == "10001"
      && current.res.body[0].inputNote == "201206-01"
      && current.res.body[0].message == "指定されたPlaceCodeがシステム上に存在しません。Code:P2012-07"
      && current.res.body[1].code == "10001"
      && current.res.body[1].inputNote == "201206-01"
      && current.res.body[1].message == "指定されたTeamCodeがシステム上に存在しません。Code:T2012-07"
    dump:
      expr: current.res.body
      out: ../Dump/EC2012-06.json
  confirmPlaceSchedule:
    desc: "会場日程が登録されない"
    db:
      query: |
        SELECT
          ps1.place_schedule_id::text
          , ps1.place_id::text
          , p1.place_code
          , ps1.team_id::text
          , t1.team_code
          , status
          , to_char(exam_date, 'yyyymmdd') as examdate
          , start_time
          , to_char(ps1.created_at, 'yyyymmdd') as created_at
          , ps1.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.place_schedule ps1
        JOIN
          resultcollector.teams t1
        ON 
          ps1.team_id = t1.team_id
        JOIN
          resultcollector.places p1
        ON 
          ps1.place_id = p1.place_id
        ORDER BY
          ps1.place_id, ps1.team_id;
    test: |
      len(current.rows) == 1
      // 班コード・会場コードが存在する会場日程が追加される
      && current.rows[0].place_id == "e0002012-0000-0000-0000-000000000006"
      && current.rows[0].place_code == "P2012-06"
      && current.rows[0].team_id == "c0002012-0000-0000-0000-000000000006"
      && current.rows[0].team_code == "T2012-06"
      && current.rows[0].examdate == '20300306'
      && current.rows[0].start_time == '1530'
      && current.rows[0].status == 21
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
