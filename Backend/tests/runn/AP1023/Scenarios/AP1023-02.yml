desc: AP1023-02 ログイン状態更新_無効なアクセストークン [401]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
    useCookie: true
vars:
  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..V8z3TLUIm1lzqDT4AhpDOXzhub9NoT_eywS6oDSGrkQ"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ./AP1023-03.yml
  post:
    desc: "ログイン状態更新_無効なアクセストークン"
    req:
      /api/v1/staff/login/refresh:
        post:
          body:
            application/json:
              token: "{{ vars.token }}"
    test: |
      current.res.status == 401
    dump:
      expr: current.res.body
      out: ../Dump/AP1023-02.json

