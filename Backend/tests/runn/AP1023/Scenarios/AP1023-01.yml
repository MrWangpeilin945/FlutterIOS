desc: AP1023-01 ログイン状態更新_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
    useCookie: true
vars:
  staffId: "affd0000-0000-0000-0000-000000000002"
  response: "json://../Dump/AP1023-01.json"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ./AP1023-03.yml
  post:
    desc: "ログイン状態更新_正常"
    req:
      /api/v1/staff/login/refresh:
        post:
          body:
            application/json:
              token: "{{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 200
      && steps.getAccessToken.token != vars.response.token
    dump:
      expr: current.res.body
      out: ../Dump/AP1023-01.json
  refreshTokens:
    desc: "ログイン状態の更新確認"
    db:
      query: |
        SELECT
          token
        FROM
          resultcollector.refresh_tokens
        WHERE
          staff_id = '{{ vars.staffId }}'
        ORDER BY
          created_at desc; 
    test: |
      current.rows[0].token != steps.getAccessToken.refreshToken

