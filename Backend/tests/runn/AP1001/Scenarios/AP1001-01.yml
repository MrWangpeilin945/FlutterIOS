desc: AP1001-01 ログイン_正常 [200]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/AP1001-01.json"
steps:
  post:
    desc: "ログイン_正常"
    req:
      /api/v1/staff/login:
        post:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
    dump:
      expr: current.res.body
      out: ../Dump/AP1001-01.json
