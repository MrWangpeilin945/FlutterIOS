desc: AP1003-02 班取得_必須パラメータ不足 [400]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: true
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path: ../../Helpers/adminAccessToken.yml
  get:
    desc: "班取得_必須パラメータ不足"
    req:
      /api/v1/placeSchedules/teams:
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 400
    dump:
      expr: current.res.body
      out: ../Dump/AP1003-02.json
