desc: EC2006-90 班の負荷リクエストデータのテスト
runners:
  db: ${DB_HOST}
vars:
  recordCount: 10000
steps:
  createUniqueKeys:
    desc: "ユニークなキーの作成"
    db:
      query: |
        WITH RECURSIVE numbers AS (
          SELECT 1 AS num
          UNION ALL
          SELECT num + 1
          FROM numbers
          WHERE num < {{ vars.recordCount}}
        )
        SELECT
          'Code-' || num AS code
        FROM
          numbers;
    bind:
      uniqueCode: current.rows
  createRequest:
    desc: "リクエストデータの作成"
    loop:
      count: vars.recordCount
    bind:
      requestBody:
        -
          code: uniqueCode[i].code
          name: "'負荷テスト_班テーブル'"
          inputNote: "'inputNote2006-90'"
  outRequestBody:
    desc: "リクエストデータをJSONで出力"
    dump:
      expr: requestBody
      out: ../../EC2006/Requests/EC2006-90.json

