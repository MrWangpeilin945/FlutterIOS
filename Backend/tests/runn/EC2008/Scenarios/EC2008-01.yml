desc: EC2008-01 団体を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2008-01.json"
steps:
  clearTable:
    desc: "団体テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.organizations CASCADE;
  post:
    desc: "団体を登録_正常"
    req:
      /api/v1/external/organizations:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && current.res.body == null
  confirmOrganizations:
    desc: "団体の登録を確認"
    db:
      query: |
        SELECT
          organization_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.organizations
        ORDER BY
          organization_code ASC;
    test: |
      // リクエストの３つの班が追加されたことを確認
      len(current.rows) == 3
      && current.rows[0].organization_code == "G2008-01-1"
      && current.rows[0].name == "株式会社岡山"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].organization_code == "G2008-01-2"
      && current.rows[1].name == "株式会社倉敷"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      && current.rows[2].organization_code == "G2008-01-3"
      && current.rows[2].name == "津山株式会社"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"