desc: EC2008-01 団体を登録_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2008-01.json"
steps:
  deleteInsertorganizations:
    desc: "挿入する団体を削除する"
    db:
      query: |
        DELETE
        FROM
          resultcollector.organizations
        WHERE
          organization_code in ('G200801', 'G200802', 'G200803')
  getOrderNumber:
    desc: "表示順の取得"
    db:
      query: |
        SELECT
          max(order_number)
        FROM
          resultcollector.organizations
    bind:
      organizationsCount: current.rows[0].max
  post:
    desc: "団体を登録_正常"
    req:
      /api/v1/external/organizations:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && len(current.res.body) == 0
    dump:
      expr: current.res.body
      out: ../Dump/EC2008-01.json
  confirmTeams:
    desc: "団体の登録を確認"
    db:
      query: |
        SELECT
          organization_code
          , name
          , order_number
        FROM
          resultcollector.organizations
        WHERE
          organization_code in ('G200801', 'G200802', 'G200803')
        ORDER BY
          organization_code ASC;
    test: |
      // リクエストの３つの班が追加されたことを確認
      len(current.rows) == 3
      && current.rows[0].organization_code == "G200801"
      && current.rows[0].name == "株式会社岡山"
      && current.rows[0].order_number == organizationsCount + 1
      && current.rows[1].organization_code == "G200802"
      && current.rows[1].name == "株式会社倉敷"
      && current.rows[1].order_number == organizationsCount + 2
      && current.rows[2].organization_code == "G200803"
      && current.rows[2].name == "津山株式会社"
      && current.rows[2].order_number == organizationsCount + 3
