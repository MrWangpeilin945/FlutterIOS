desc: EC2008-05 除外されてないものは追加更新_正常 [207]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2008-05.json"
steps:
  clearTable:
    desc: "団体テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.organizations CASCADE;
  insertData:
    desc: "団体テーブルに実行前データを登録"
    db: 
      query: |
        insert into resultcollector.organizations (organization_code, name , order_number , created_at, created_by) 
            values('G2008-05-1', '株式会社古都岡山', 1, '2025-01-01T12:34:56.789', 'EC2008') 
            ,     ('G2008-05-2', '株式会社古都倉敷', 2, '2025-01-01T12:34:56.789', 'EC2008')
            ,     ('G2008-05-3', '古都津山株式会社', 3, '2025-01-01T12:34:56.789', 'EC2008')
            ,     ('G2008-05-99', '大天領有限会社', 99, '2025-01-01T12:34:56.789', 'EC2008');
  post:
    desc: "団体を更新_正常"
    req:
      /api/v1/external/organizations:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      && len(current.res.body) == 8
      // 必須項目不足のレコードがエラーで返される
      && current.res.body[0].code == "10004"
      && current.res.body[0].inputNote == "20080502"
      && current.res.body[0].message == "必須項目が不足しています。Code"
      && current.res.body[1].code == "10004"
      && current.res.body[1].inputNote == "20080507"
      && current.res.body[1].message == "必須項目が不足しています。Code"
      && current.res.body[2].code == "10004"
      && current.res.body[2].inputNote == "20080504"
      && current.res.body[2].message == "必須項目が不足しています。Name"
      && current.res.body[3].code == "10004"
      && current.res.body[3].inputNote == "20080507"
      && current.res.body[3].message == "必須項目が不足しています。Name"
      // キー重複のレコードがエラーで返される
      && current.res.body[4].code == "10003"
      && current.res.body[4].inputNote == "20080502"
      && current.res.body[4].message == "キー項目が重複しています。Code:"
      && current.res.body[5].code == "10003"
      && current.res.body[5].inputNote == "20080503"
      && current.res.body[5].message == "キー項目が重複しています。Code:G2008-05-3"
      && current.res.body[6].code == "10003"
      && current.res.body[6].inputNote == "20080505"
      && current.res.body[6].message == "キー項目が重複しています。Code:G2008-05-3"
      && current.res.body[7].code == "10003"
      && current.res.body[7].inputNote == "20080507"
      && current.res.body[7].message == "キー項目が重複しています。Code:"
    dump:
      expr: current.res.body
      out: ../Dump/EC2008-05.json
  confirmPlaces:
    desc: "団体の更新を確認"
    db:
      query: |
        SELECT
          organization_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.organizations
        ORDER BY
          organization_code ASC;
    test: |
      len(current.rows) == 5
      // エラーの無いリクエストの団体が追加・変更されたことを確認
      && current.rows[0].organization_code == "G2008-05-1"
      && current.rows[0].name == "株式会社新岡山"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[3].organization_code == "G2008-05-6"
      && current.rows[3].name == "新日本株式会社"
      && current.rows[3].order_number == 101
      && current.rows[3].created_at == current.rows[3].now
      && current.rows[3].created_by == "ExternalConnection"
      // 除外された団体の名称は変更されないことを確認
      && current.rows[1].organization_code == "G2008-05-2"
      && current.rows[1].name == "株式会社古都倉敷"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == "20250101"
      && current.rows[1].created_by == "EC2008"
      && current.rows[2].organization_code == "G2008-05-3"
      && current.rows[2].name == "古都津山株式会社"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == "20250101"
      && current.rows[2].created_by == "EC2008"
      && current.rows[4].organization_code == "G2008-05-99"
      && current.rows[4].name == "大天領有限会社"
      && current.rows[4].order_number == 99
      && current.rows[4].created_at == "20250101"
      && current.rows[4].created_by == "EC2008"
