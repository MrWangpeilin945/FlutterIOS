desc: EC2008-02 団体を更新_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2008-02.json"
steps:
  clearTable:
    desc: "団体テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.organizations CASCADE;
  insertData:
    desc: "団体テーブルに実行前データを登録"
    db: 
      query: |
        insert into resultcollector.organizations(organization_code, name, order_number, created_at, created_by)
            values('G2008-02-1', '株式会社古都岡山', 1, '2025-01-01T12:34:56.789', 'ec2008')
            ,     ('G2008-02-2', '株式会社古都倉敷', 2, '2025-01-01T12:34:56.789', 'ec2008')
            ,     ('G2008-02-3', '古都津山株式会社', 3, '2025-01-01T12:34:56.789', 'ec2008');
  post:
    desc: "団体を更新_正常"
    req:
      /api/v1/external/organizations:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // レスポンスにErrorObjectが返されないことを確認
      && current.res.body == null
  confirmPlaces:
    desc: "団体の更新を確認"
    db:
      query: |
        SELECT
          organization_code
          , name
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.organizations
        ORDER BY
          organization_code ASC;
    test: |
      len(current.rows) == 3
      // リクエストの２つの団体の名称は変更されたことを確認
      && current.rows[0].organization_code == "G2008-02-1"
      && current.rows[0].name == "株式会社新岡山"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].organization_code == "G2008-02-2"
      && current.rows[1].name == "株式会社新倉敷"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      // リクエストに存在しない団体の名称は変更されないことを確認
      && current.rows[2].organization_code == "G2008-02-3"
      && current.rows[2].name == "古都津山株式会社"
      && current.rows[2].order_number == 3
      && current.rows[2].created_at == "20250101"
      && current.rows[2].created_by == "ec2008"