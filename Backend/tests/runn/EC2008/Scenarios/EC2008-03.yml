desc: EC2008-02 キー重複を除外_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2008-03.json"
steps:
  clearTable:
    desc: "団体情報テーブルをクリア"
    db:
      query: TRUNCATE TABLE resultcollector.organizations CASCADE;
  insertData:
    desc: "団体情報テーブルに実行前データを登録"
    db: 
      query: |
        insert into resultcollector.organizations(organization_code, name, order_number, created_at, created_by)
            values('G200804', '合同会社日本', 7, CURRENT_TIMESTAMP, 'ex2008')
            ,     ('G200805', '株式会社東京', 8, CURRENT_TIMESTAMP, 'ex2008');
  getOrganizations:
    desc: "団体情報の取得"
    db:
      query: |
        SELECT
          organization_code
          , name
          , order_number
        FROM
          resultcollector.organizations
        WHERE
          organization_code in ('G200804', 'G200805')
        ORDER BY
          organization_code ASC
    bind:
      organizationsData: current.rows
  post:
    desc: "団体を更新_正常"
    req:
      /api/v1/external/organizations:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      && len(current.res.body) == 2
      // キー重複のレコードがエラーで返される
      && current.res.body[0].code == "10003"
      && current.res.body[0].inputNote == "2008022A"
      && current.res.body[0].message == "キー項目が重複しています。Code:G200805"
      && current.res.body[1].code == "10003"
      && current.res.body[1].inputNote == "2008022B"
      && current.res.body[1].message == "キー項目が重複しています。Code:G200805"
    dump:
      expr: current.res.body
      out: ../Dump/EC2008-02.json
  confirmTeams:
    desc: "団体の更新を確認"
    db:
      query: |
        SELECT
          organization_code
          , name
          , order_number
        FROM
          resultcollector.organizations
        WHERE
          organization_code in ('G200804', 'G200805')
        ORDER BY
          organization_code ASC
    test: |
      len(current.rows) == 2
      // 重複していないリクエストの団体の名称は変更されたことを確認
      && current.rows[0].organization_code == organizationsData[0].organization_code
      && current.rows[0].name == "新日本株式会社"
      && current.rows[0].order_number == organizationsData[0].order_number
      // 除外された団体の名称は変更されないことを確認
      && current.rows[1].organization_code == organizationsData[1].organization_code
      && current.rows[1].name == organizationsData[1].name
      && current.rows[1].order_number == organizationsData[1].order_number
