desc: EC2002-03 連携キーの取得に失敗
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2002-03.json"
  connectionCode1: "EX2002021"
  connectionCode2: "EX2002022"
steps:
  clearTable:
    desc: "関連テーブルのクリア"
    db:
      query: |
        -- 受付
        TRUNCATE TABLE resultcollector.tickets CASCADE;
        -- 受付履歴
        TRUNCATE TABLE resultcollector.tickets_histories CASCADE;
        -- 受診者
        TRUNCATE TABLE resultcollector.examinees CASCADE;
        -- 会場
        TRUNCATE TABLE resultcollector.places CASCADE;
        -- 班
        TRUNCATE TABLE resultcollector.teams CASCADE;
  insertData:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 班
        INSERT INTO
          resultcollector.teams
          (team_id, team_code, name, order_number, created_at, created_by)
        VALUES('f0002002-0000-0000-0003-000000000001', 'T2002-03', '丙班', 1, CURRENT_TIMESTAMP, 'ec2002');
        -- 会場
        INSERT INTO
          resultcollector.places
          (place_id, place_code, name, order_number, created_at, created_by)
        VALUES('b0002002-0000-0000-0003-000000000001', 'P2002-03', '丙会場', 1, CURRENT_TIMESTAMP, 'ec2002');
        -- 会場日程
        INSERT INTO
          resultcollector.place_schedule
          (place_schedule_id, place_id, team_id, status, exam_date, start_time, created_at, created_by)
        VALUES('a0002002-0000-0000-0003-000000000001', 'b0002002-0000-0000-0003-000000000001', 'f0002002-0000-0000-0003-000000000001', 31, '2025/03/03', '1500', CURRENT_TIMESTAMP, 'ec2002');
        -- 受診者
        INSERT INTO
          resultcollector.examinees
          (examinee_id, examinee_code, name, kana_name, sex, birthdate, created_at, created_by)
        VALUES('e0002002-0000-0000-0003-000000000001', 'E2002031', '両備　太郎', 'リョウビ　タロウ', 1, '1991-01-30', CURRENT_TIMESTAMP,'ec2002')
        ,     ('e0002002-0000-0000-0003-000000000002', 'E2002032', '両備　花子', 'リョウビ　ハナコ', 2, '1989-03-15', CURRENT_TIMESTAMP,'ec2002');
        -- 受診
        INSERT INTO
          resultcollector.consult
          (consult_id, consult_number, progress_status, export_status, place_schedule_id, note, examinee_id, external_connection_code, created_at, created_by)
        VALUES('c0002002-0000-0000-0003-000000000001', 'C2002021', 10, 11, 'a0002002-0000-0000-0003-000000000001','','e0002002-0000-0000-0003-000000000001','EX2002031', CURRENT_TIMESTAMP,'ec2002')
        ,     ('c0002002-0000-0000-0003-000000000002', 'C2002022', 20, 11, 'a0002002-0000-0000-0003-000000000001','','e0002002-0000-0000-0003-000000000002','EX2002032', CURRENT_TIMESTAMP,'ec2002');
  getConsult:
    desc: "受診情報の取得"
    db:
      query: |
        SELECT
          external_connection_code
          , progress_status
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
        FROM
          resultcollector.consult
        ORDER BY
          external_connection_code ASC;
    bind: 
      consultData: current.rows
  post:
    desc: "連携キーの取得に失敗"
    req:
      /api/v1/external/tickets:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // レスポンスにErrorObjectが返されることを確認
      && len(current.res.body) == 3
      && current.res.body[0].code == "10001"
      && current.res.body[0].message == "指定されたConnectionCodeがシステム上に存在しません。Code:EX2002031"
      && current.res.body[0].inputNote == "2002031"
      && current.res.body[1].code == "10001"
      && current.res.body[1].message == "指定されたConnectionCodeがシステム上に存在しません。Code:EX2002032"
      && current.res.body[1].inputNote == "2002032"
      && current.res.body[2].code == "10001"
      && current.res.body[2].message == "指定されたConnectionCodeがシステム上に存在しません。Code:EX2002033"
      && current.res.body[2].inputNote == "2002033"
    dump:
      expr: current.res.body
      out: ../Dump/EC2002-03.json
  confirmTickets:
    desc: "受付の登録を確認"
    db:
      query: |
        SELECT
          t.ticket_number
          , c.external_connection_code
          , to_char(t.created_at, 'yyyymmdd') as created_at
          , t.created_by
        FROM
          resultcollector.tickets t
        LEFT JOIN
          resultcollector.consult c
            on t.consult_id = c.consult_id
    test: |
      // 受付が登録されないことを確認
      len(current.rows) == 0
  confirmTicketsHistories:
    desc: "受付履歴の登録を確認"
    db:
      query: |
        SELECT
          ticket_number
        FROM
          resultcollector.tickets_histories
    test: |
      // 受付履歴が登録されないことを確認
      len(current.rows) == 0
  confirmConsult:
    desc: "受診の更新を確認"
    db:
      query: |
        SELECT
          consult_id::text
          , external_connection_code
          , progress_status
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
        FROM
          resultcollector.consult
        ORDER BY
          external_connection_code ASC;
    test: |
      // 2件の受診情報が更新されていないことを確認
      len(current.rows) == 2
      && current.rows[0].consult_id == "c0002002-0000-0000-0003-000000000001"
      && current.rows[0].external_connection_code == consultData[0].external_connection_code
      && current.rows[0].progress_status == consultData[0].progress_status
      && current.rows[0].created_at == consultData[0].created_at
      && current.rows[0].created_by == consultData[0].created_by
      && current.rows[1].consult_id == "c0002002-0000-0000-0003-000000000002"
      && current.rows[1].external_connection_code == consultData[1].external_connection_code
      && current.rows[1].progress_status == consultData[1].progress_status
      && current.rows[1].created_at == consultData[1].created_at
      && current.rows[1].created_by == consultData[1].created_by
