desc: EC2002-02 受付を更新削除_正常 [200]
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2002-02.json"
  connectionCode1: "EX2002021"
  connectionCode2: "EX2002022"
steps:
  clearTable:
    desc: "関連テーブルのクリア"
    db:
      query: |
        -- 受付
        TRUNCATE TABLE resultcollector.tickets CASCADE;
        -- 受付履歴
        TRUNCATE TABLE resultcollector.tickets_histories CASCADE;
        -- 受診者
        TRUNCATE TABLE resultcollector.examinees CASCADE;
        -- 会場
        TRUNCATE TABLE resultcollector.places CASCADE;
        -- 班
        TRUNCATE TABLE resultcollector.teams CASCADE;
  insertData:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 班
        INSERT INTO
          resultcollector.teams
          (team_id, team_code, name, order_number, created_at, created_by)
        VALUES('f0002002-0000-0000-0002-000000000001', 'T2002-02', '乙班', 1, CURRENT_TIMESTAMP, 'ec2002');
        -- 会場
        INSERT INTO
          resultcollector.places
          (place_id, place_code, name, order_number, created_at, created_by)
        VALUES('b0002002-0000-0000-0002-000000000001', 'P2002-02', '乙会場', 1, CURRENT_TIMESTAMP, 'ec2002');
        -- 会場日程
        INSERT INTO
          resultcollector.place_schedule
          (place_schedule_id, place_id, team_id, status, exam_date, start_time, created_at, created_by)
        VALUES('a0002002-0000-0000-0002-000000000001', 'b0002002-0000-0000-0002-000000000001', 'f0002002-0000-0000-0002-000000000001', 31, '2025/03/03', '1500', CURRENT_TIMESTAMP, 'ec2002');
        -- 受診者
        INSERT INTO
          resultcollector.examinees
          (examinee_id, examinee_code, name, kana_name, sex, birthdate, created_at, created_by)
        VALUES('e0002002-0000-0000-0002-000000000001', 'E2002021', '両備　太郎', 'リョウビ　タロウ', 1, '1991-01-30', CURRENT_TIMESTAMP,'ec2002')
        ,     ('e0002002-0000-0000-0002-000000000002', 'E2002022', '両備　花子', 'リョウビ　ハナコ', 2, '1989-03-15', CURRENT_TIMESTAMP,'ec2002');
        -- 受診
        INSERT INTO
          resultcollector.consult
          (consult_id, consult_number, progress_status, export_status, place_schedule_id, note, examinee_id, external_connection_code, created_at, created_by)
        VALUES('c0002002-0000-0000-0002-000000000001', 'C2002021', 21, 11, 'a0002002-0000-0000-0002-000000000001','','e0002002-0000-0000-0002-000000000001','EX2002021', CURRENT_TIMESTAMP,'ec2002')
        ,     ('c0002002-0000-0000-0002-000000000002', 'C2002022', 11, 11, 'a0002002-0000-0000-0002-000000000001','','e0002002-0000-0000-0002-000000000002','EX2002022', CURRENT_TIMESTAMP,'ec2002');
        -- 受付
        INSERT INTO
          resultcollector.tickets
          (consult_id, ticket_number, created_at, created_by)
        VALUES('c0002002-0000-0000-0002-000000000001', 'T2002021', '2025-01-01T12:34:56.789', 'ec2002')
        ,     ('c0002002-0000-0000-0002-000000000002', 'T2002022', '2025-01-01T12:34:56.789','ec2002');
  getTickets:
    desc: "受付情報を取得する"
    db:
      query: |
        SELECT
          t.consult_id::text
          , t.ticket_number
          , c.external_connection_code
          , to_char(t.created_at, 'yyyymmdd') as created_at
          , t.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.tickets t
        LEFT JOIN
          resultcollector.consult c
            on t.consult_id = c.consult_id
        ORDER BY
          c.external_connection_code ASC;
    bind:
      ticketsData: current.rows
  post:
    desc: "受付を登録_正常"
    req:
      /api/v1/external/tickets:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 200
      // レスポンスにErrorObjectが返されないことを確認
      && len(current.res.body) == 0
    dump:
      expr: current.res.body
      out: ../Dump/EC2002-02.json
  confirmTickets:
    desc: "受付の登録を確認"
    db:
      query: |
        SELECT
          t.consult_id::text
          , t.ticket_number
          , c.external_connection_code
          , to_char(t.created_at, 'yyyymmdd') as created_at
          , t.created_by
        FROM
          resultcollector.tickets t
        LEFT JOIN
          resultcollector.consult c
            on t.consult_id = c.consult_id
    test: |
      // リクエストのSortNoが大きい2件が処理され、受付が1件削除、1件更新されたことを確認
      len(current.rows) == 1
      && current.rows[0].consult_id == ticketsData[1].consult_id
      && current.rows[0].external_connection_code == ticketsData[1].external_connection_code
      && current.rows[0].ticket_number != ticketsData[1].ticket_number
      && current.rows[0].created_at > ticketsData[1].created_at
      && current.rows[0].created_by == "ExternalConnection"
  confirmTicketsHistories:
    desc: "受付履歴の登録を確認"
    db:
      query: |
        SELECT
          t.consult_id::text
          , t.ticket_number
          , t.action_type
          , t.order_number
          , c.external_connection_code
          , to_char(t.created_at, 'yyyymmdd') as created_at
          , t.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.tickets_histories t
        LEFT JOIN
          resultcollector.consult c
            on t.consult_id = c.consult_id
        ORDER BY
          t.order_number ASC;
    test: |
      // リクエストの6件の受付履歴が追加されたことを確認
      len(current.rows) == 6
      && current.rows[0].consult_id == "c0002002-0000-0000-0002-000000000001"
      && current.rows[0].external_connection_code == vars.connectionCode1
      && current.rows[0].ticket_number == "T2002011"
      && current.rows[0].action_type == "I"
      && current.rows[0].order_number == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].consult_id == "c0002002-0000-0000-0002-000000000002"
      && current.rows[1].external_connection_code == vars.connectionCode2
      && current.rows[1].ticket_number == ""
      && current.rows[1].action_type == "D"
      && current.rows[1].order_number == 2
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
      && current.rows[2].consult_id == "c0002002-0000-0000-0002-000000000002"
      && current.rows[2].external_connection_code == vars.connectionCode2
      && current.rows[2].ticket_number == "T2002014"
      && current.rows[2].action_type == "I"
      && current.rows[2].order_number == 4
      && current.rows[2].created_at == current.rows[2].now
      && current.rows[2].created_by == "ExternalConnection"
      && current.rows[3].consult_id == "c0002002-0000-0000-0002-000000000001"
      && current.rows[3].external_connection_code == vars.connectionCode1
      && current.rows[3].ticket_number == "T2002013"
      && current.rows[3].action_type == "I"
      && current.rows[3].order_number == 10
      && current.rows[3].created_at == current.rows[3].now
      && current.rows[3].created_by == "ExternalConnection"
      && current.rows[4].consult_id == "c0002002-0000-0000-0002-000000000002"
      && current.rows[4].external_connection_code == vars.connectionCode2
      && current.rows[4].ticket_number == "T2002999"
      && current.rows[4].action_type == "I"
      && current.rows[4].order_number == 12
      && current.rows[4].created_at == current.rows[4].now
      && current.rows[4].created_by == "ExternalConnection"
      && current.rows[5].consult_id == "c0002002-0000-0000-0002-000000000001"
      && current.rows[5].external_connection_code == vars.connectionCode1
      && current.rows[5].ticket_number == ""
      && current.rows[5].action_type == "D"
      && current.rows[5].order_number == 15
      && current.rows[5].created_at == current.rows[5].now
      && current.rows[5].created_by == "ExternalConnection"
  confirmConsult:
    desc: "受診の更新を確認"
    db:
      query: |
        SELECT
          consult_id::text
          , external_connection_code
          , progress_status
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.consult
        ORDER BY
          external_connection_code ASC;
    test: |
      // 2件の受診の進捗状況が削除処理は来場待ち(11)、更新処理は検査中(21)に更新されたことを確認
      len(current.rows) == 2
      && current.rows[0].consult_id == "c0002002-0000-0000-0002-000000000001"
      && current.rows[0].external_connection_code == vars.connectionCode1
      && current.rows[0].progress_status == 11
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[1].consult_id == "c0002002-0000-0000-0002-000000000002"
      && current.rows[1].external_connection_code == vars.connectionCode2
      && current.rows[1].progress_status == 21
      && current.rows[1].created_at == current.rows[1].now
      && current.rows[1].created_by == "ExternalConnection"
