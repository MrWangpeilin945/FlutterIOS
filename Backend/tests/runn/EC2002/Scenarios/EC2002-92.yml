desc: EC2002-92 受付の削除負荷テスト
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  recordCount: 1000
steps:
  clearTable:
    desc: "関連テーブルをクリア"
    db:
      query: |
        -- 受付
        TRUNCATE TABLE resultcollector.tickets CASCADE;
        -- 受付履歴
        TRUNCATE TABLE resultcollector.tickets_histories CASCADE;
        -- 受診者
        TRUNCATE TABLE resultcollector.examinees CASCADE;
        -- 会場
        TRUNCATE TABLE resultcollector.places CASCADE;
        -- 班
        TRUNCATE TABLE resultcollector.teams CASCADE;
  insertTable:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 班
        INSERT INTO
          resultcollector.teams
          (team_id, team_code, name, order_number, created_at, created_by)
        VALUES('f0002002-0000-0000-0092-000000000001', 'T2002-92', '班', 1, CURRENT_TIMESTAMP, 'ec2002');
        -- 会場
        INSERT INTO
          resultcollector.places
          (place_id, place_code, name, order_number, created_at, created_by)
        VALUES('b0002002-0000-0000-0092-000000000001', 'P2002-92', '会場', 1, CURRENT_TIMESTAMP, 'ec2002');
        -- 会場日程
        INSERT INTO
          resultcollector.place_schedule
          (place_schedule_id, place_id, team_id, status, exam_date, start_time, created_at, created_by)
        VALUES('a0002002-0000-0000-0092-000000000001', 'b0002002-0000-0000-0092-000000000001', 'f0002002-0000-0000-0092-000000000001', 31, '2025/03/03', '1500', CURRENT_TIMESTAMP, 'ec2002');
        -- 受診者
        INSERT INTO
          resultcollector.examinees
          (examinee_id, examinee_code, name, kana_name, sex, birthdate, created_at, created_by)
        VALUES('e0002002-0000-0000-0092-000000000001', 'E2002921', '両備　太郎', 'リョウビ　タロウ', 1, '1991-01-30', CURRENT_TIMESTAMP,'ec2002');
  createUniqueKeys:
    desc: "ユニークなキーの作成"
    db:
      query: |
        WITH RECURSIVE numbers AS (
          SELECT 1 AS num
          UNION ALL
          SELECT num + 1
          FROM numbers
          WHERE num < {{ vars.recordCount}}
        )
        SELECT
          'C-' || lpad(cast(num as character varying), 6, '0') AS code
          , 'T-' || lpad(cast(num as character varying), 6, '0') AS ticket
          , num As number
        FROM
          numbers;
    bind:
      uniqueCode: current.rows
  createConsult:
    desc: "受診テーブルに実行前データを登録"
    loop: vars.recordCount
    db: 
      query: |
        INSERT INTO
          resultcollector.consult
            (consult_number, progress_status, export_status, place_schedule_id, note, examinee_id, external_connection_code, created_at, created_by)
        VALUES
          (
            '{{ uniqueCode[i].code }}' 
            , 21
            , 11
            , 'a0002002-0000-0000-0092-000000000001'
            , ''
            , 'e0002002-0000-0000-0092-000000000001'
            , '{{ uniqueCode[i].code }}' 
            , CURRENT_TIMESTAMP
            , 'ec2002'
          );
  getConsult:
    desc: "受診テーブルに登録された受診IDを取得する"
    db:
      query: |
        SELECT
          consult_id::text
        FROM
          resultcollector.consult
        ORDER BY
          consult_number;
    bind:
      consultIds: current.rows
  careteTckets:
    desc: "受付テーブルに実行前データを登録"
    loop: vars.recordCount
    db: 
      query: |
        INSERT INTO
          resultcollector.tickets
            (consult_id, ticket_number, created_at, created_by)
        VALUES
          (
            '{{ consultIds[i].consult_id }}' 
            , '{{ uniqueCode[i].ticket }}'
            , '2025-01-01T12:34:56.789'
            , 'ec2002'
          );
  careteTcketsHistories:
    desc: "受付履歴テーブルに実行前データを登録"
    loop: vars.recordCount
    db: 
      query: |
        INSERT INTO
          resultcollector.tickets_histories
            (consult_id, ticket_number, action_type, order_number, created_at, created_by)
        VALUES
          (
            '{{ consultIds[i].consult_id }}' 
            , '{{ uniqueCode[i].ticket }}'
            , 'I'
            , {{ uniqueCode[i].number }}
            , '2025-01-01T12:34:56.789'
            , 'ec2002'
          );
  createRequest:
    desc: "リクエストデータの作成"
    loop:
      count: vars.recordCount
    bind:
      requestBody:
        -
          sortNo: uniqueCode[i].number
          connectionCode: uniqueCode[i].code
          actionType: 1
          ticketNumber: uniqueCode[i].ticket
          inputNote: "'2002-92'"
  startBatch:
    desc: "処理の開始時間"
    bind:
      startTime: now()
  post:
    desc: "受診者の登録"
    req:
      /api/v1/external/tickets:
        post:
          body:
            application/json:
              "{{ requestBody }}"
    test: |
      current.res.status == 200
    bind:
      endTime: now()
  endBatch:
    desc: "処理の終了時間"
    bind:
      timeKeeper:
        startTime: startTime.Format("2006-01-02T15:04:05Z07:00")
        endTime: endTime.Format("2006-01-02T15:04:05Z07:00")
        interval: endTime.Sub(startTime).Seconds() 
  confirmTickets:
    desc: "受付の削除を確認"
    db:
      query: |
        SELECT
          consult_id::text
        FROM
          resultcollector.tickets
    test: |
      len(current.rows) == 0
  confirmTicketsHistories:
    desc: "受付履歴の登録を確認"
    db:
      query: |
        SELECT
          consult_id::text
          , ticket_number
          , action_type
          , order_number
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.tickets_histories
        ORDER BY
          action_type ASC
          , order_number ASC;
    test: |
      len(current.rows) == vars.recordCount * 2
      && current.rows[0].consult_id == consultIds[0].consult_id
      && current.rows[0].ticket_number == ""
      && current.rows[0].action_type == "D"
      && current.rows[0].order_number == uniqueCode[0].number
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].consult_id == consultIds[vars.recordCount - 1].consult_id
      && current.rows[vars.recordCount - 1].ticket_number == ""
      && current.rows[vars.recordCount - 1].action_type == "D"
      && current.rows[vars.recordCount - 1].order_number == uniqueCode[vars.recordCount - 1].number
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
  confirmConsult:
    desc: "受診の更新を確認"
    db:
      query: |
        SELECT
          consult_id::text
          , external_connection_code
          , progress_status
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.consult
        ORDER BY
          external_connection_code ASC;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].consult_id == consultIds[0].consult_id
      && current.rows[0].external_connection_code == uniqueCode[0].code
      && current.rows[0].progress_status == 11
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].consult_id == consultIds[vars.recordCount - 1].consult_id
      && current.rows[vars.recordCount - 1].external_connection_code == uniqueCode[vars.recordCount - 1].code
      && current.rows[vars.recordCount - 1].progress_status == 11
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
    dump:
      expr: timeKeeper
      out: ../Dump/EC2002-92.json
