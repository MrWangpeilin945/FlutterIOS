desc: AP1020-02 結果出力履歴_無効なアクセストークン [401]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: true
steps:
  get:
    desc: "結果出力履歴_無効なアクセストークン"
    req:
      /api/v1/integrations/examResults/exportHistory:
        get:
          headers:
            Authorization: "Bearer invalidToken"
    test: |
      current.res.status == 401
    dump:
      expr: current.res.body
      out: ../Dump/AP1020-02.json
