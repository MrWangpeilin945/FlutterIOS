desc: AP1013-05 結果検証_バリデーションエラーあり [422]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  consultNumber: "1013"
  request: "json://../Requests/AP1013-05.json"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  post:
    desc: "結果検証_バリデーションエラーあり"
    req:
      /api/v1/consult/{{ vars.consultNumber }}/results/verify:
        post:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 422
    dump:
      expr: current.res.body
      out: ../Dump/AP1013-05.json

