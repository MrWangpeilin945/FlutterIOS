desc: AP1010-03 検査内容取得_無効なアクセストークン [401]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: true
vars:
  consultNumber: "0001"
  examMenuId: 1
steps:
  get:
    desc: "検査内容取得_無効なアクセストークン"
    req:
      /api/v1/consult/{{ vars.consultNumber }}/examItems?examMenuId={{ vars.examMenuId }}:
        get:
          headers:
            Authorization: "Bearer invalidToken"
    test: |
      current.res.status == 401
    dump:
      expr: current.res.body
      out: ../Dump/AP1010-03.json

