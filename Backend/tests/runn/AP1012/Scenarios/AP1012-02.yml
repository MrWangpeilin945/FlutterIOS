desc: AP1012-02 検査機器取得_指定した検査メニューID形式が不正 [400]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: true
    skipValidateResponse: true
vars:
  examMenuId: "text"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  get:
    desc: "検査機器取得_指定した検査メニューID形式が不正"
    req:
      /api/v1/equipments?examMenuId={{ vars.examMenuId }}:
        get:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 400
    dump:
      expr: current.res.body
      out: ../Dump/AP1012-02.json

