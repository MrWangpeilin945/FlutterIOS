desc: AP1021-02 結果連携未出力_指定した出力IDの形式が不正 [400]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: true
    skipValidateResponse: true
vars:
  exportId: "@999"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  post:
    desc: "結果連携未出力_指定した出力IDの形式が不正"
    req:
      /api/v1/integrations/examResults/undoExport:
        post:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
          body:
            application/json:
              exportId: "{{ vars.exportId }}"
    test: |
      current.res.status == 400
    dump:
      expr: current.res.body
      out: ../Dump/AP1021-02.json

