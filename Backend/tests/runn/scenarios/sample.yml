desc: ホームメニューを取得する
runners:
  req:
    endpoint: ${BACKEND_URL}
steps:
  getHomeMenus:
    desc: "ホームメニュー取得"
    req:
      /api/v1/homeMenus:
        get:
          body:
            application/json: null
    test: |
      current.res.status == 200
    dump:
      expr: current.res.body
      out: ../dump/homeMenus.json
