desc: AP1022-02 中止理由登録_リクエストボディの形式が不正 [400]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: true
    skipValidateResponse: true
vars:
  consultNumber: "0001"
  request: "json://../Requests/AP1022-02.json"
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  post:
    desc: "中止理由登録_リクエストボディの形式が不正"
    req:
      /api/v1/consult/{{ vars.consultNumber }}/executions:
        post:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 400
    dump:
      expr: current.res.body
      out: ../Dump/AP1022-02.json

