desc: AP1022-03 中止理由登録_無効なアクセストークン [401]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: true
vars:
  consultNumber: "0001"
  request: "json://../Requests/AP1022-03.json"
steps:
  post:
    desc: "中止理由登録_無効なアクセストークン"
    req:
      /api/v1/consult/{{ vars.consultNumber }}/executions:
        post:
          headers:
            Authorization: "Bearer invalidToken"
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 401
    dump:
      expr: current.res.body
      out: ../Dump/AP1022-03.json

