desc: EC2004-91 受診の更新負荷テスト
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  recordCount: 10000
steps:
  clearTable:
    desc: "関連テーブルをクリア"
    db:
      query: |
        -- 受診
        TRUNCATE TABLE resultcollector.consult CASCADE;
        -- 会場
        TRUNCATE TABLE resultcollector.places CASCADE; 
        -- 班
        TRUNCATE TABLE resultcollector.teams CASCADE;
        -- 受診者
        TRUNCATE TABLE resultcollector.examinees CASCADE;
        -- 検査特記
        TRUNCATE TABLE resultcollector.exam_menu_note_codes CASCADE;
        -- 基準値パターン
        TRUNCATE TABLE resultcollector.thresholds CASCADE;
        -- 外部検査項目明細
        TRUNCATE TABLE resultcollector.external_exam_item_details CASCADE;
  insertTable:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 班
        INSERT INTO
          resultcollector.teams
          (team_id, team_code, name, order_number, created_at, created_by)
        VALUES('f0002004-0000-0000-0091-000000000001', 'T2004-91', '班', 1, CURRENT_TIMESTAMP, 'ec2004');
        -- 会場
        INSERT INTO
          resultcollector.places
          (place_id, place_code, name, order_number, created_at, created_by)
        VALUES('b0002004-0000-0000-0091-000000000001', 'P2004-91', '会場', 1, CURRENT_TIMESTAMP, 'ec2004');
        -- 受診者
        INSERT INTO
          resultcollector.examinees
          (examinee_id, examinee_code, name, kana_name, sex, birthdate, created_at, created_by)
        VALUES('e0002004-0000-0000-0091-000000000001', 'E2004911', '両備　太郎', 'リョウビ　タロウ', 1, '1991-01-30', CURRENT_TIMESTAMP,'ec2004')
        ,     ('e0002004-0000-0000-0091-000000000002', 'E2004912', '両備　花子', 'リョウビ　ハナコ', 2, '1988-08-08', CURRENT_TIMESTAMP,'ec2004');
        -- 検査特記
        INSERT INTO
          resultcollector.exam_menu_note_codes
          (code, name, created_at, created_by)
        VALUES('NOTE-EC2004-1', '旧検査特記1', CURRENT_TIMESTAMP, 'ec2004')
        ,     ('NOTE-EC2004-2', '旧検査特記2', CURRENT_TIMESTAMP, 'ec2004')
        ,     ('NOTE-EC2004', '新検査特記', CURRENT_TIMESTAMP, 'ec2004');
        -- 基準値パターン
        INSERT INTO
          resultcollector.thresholds
          (threshold_id, threshold_code, name, order_number, created_at, created_by)
        VALUES('ec002004-0000-0000-0091-000000000001', 'TID-EC2004-1', '旧基準値パターン1', 1, CURRENT_TIMESTAMP, 'ec2004')
        ,     ('ec002004-0000-0000-0091-000000000002', 'TID-EC2004-2', '旧基準値パターン2', 2, CURRENT_TIMESTAMP, 'ec2004')
        ,     ('ec002004-0000-0000-0091-000000000003', 'TID-EC2004', '新基準値パターン', 3, CURRENT_TIMESTAMP, 'ec2004');
        -- 外部検査項目明細
        INSERT INTO
          resultcollector.external_exam_item_details
          (exam_item_detail_id, external_exam_item_detail_code, created_at, created_by)
        VALUES(2004911, 'PRE-EC2004-1', CURRENT_TIMESTAMP, 'ec2004')
        ,     (2004912, 'PRE-EC2004-2', CURRENT_TIMESTAMP, 'ec2004')
        ,     (2004913, 'PRE-EC2004', CURRENT_TIMESTAMP, 'ec2004') 
        ,     (2004914, 'ODR-EC2004-1', CURRENT_TIMESTAMP, 'ec2004')
        ,     (2004915, 'ODR-EC2004-2', CURRENT_TIMESTAMP, 'ec2004')
        ,     (2004916, 'ODR-EC2004', CURRENT_TIMESTAMP, 'ec2004');
  createUniqueKeys:
    desc: "ユニークなキーの作成"
    db:
      query: |
        WITH RECURSIVE numbers AS (
          SELECT 1 AS num
          UNION ALL
          SELECT num + 1
          FROM numbers
          WHERE num < {{ vars.recordCount}}
        )
        SELECT
          to_char('2025-01-01'::DATE + INTERVAL '1 day' * num ,'YYYY/MM/DD') AS examDate
          , 'CON-' || lpad(cast(num as character varying), 6, '0') AS connectioncode
          , 'PRE-' || lpad(cast(num as character varying), 6, '0') AS precode
          , 'NEW-' || lpad(cast(num as character varying), 6, '0') AS newcode
          , num As number
        FROM
          numbers;
    bind:
      uniqueKeys: current.rows
  createPlaceSchedule:
    desc: "会場日程のレコードを作成する"
    loop: vars.recordCount
    db:
      query: |
        INSERT INTO
          resultcollector.place_schedule
          (place_id, team_id, status, exam_date, start_time, created_at, created_by)
        VALUES
          (
            'b0002004-0000-0000-0091-000000000001'
            , 'f0002004-0000-0000-0091-000000000001'
            , 31 
            , '{{ uniqueKeys[i].examdate }}'
            , '1500'
            , CURRENT_TIMESTAMP
            , 'ec2004'
          );
  getPlaceSchedule:
    desc: "登録した会場日程の会場日程IDを取得する"
    db:
      query: |
        SELECT
          place_schedule_id::text
        FROM
          resultcollector.place_schedule
        ORDER BY
          exam_date ASC;
    bind:
      placeScheduleIds: current.rows
  createConsult:
    desc: "事前に受診のレコードを作成する"
    loop: vars.recordCount
    db:
      query: |
        INSERT INTO
          resultcollector.consult
          (consult_number, progress_status, export_status, place_schedule_id, note, examinee_id, external_connection_code, created_at, created_by)
        VALUES
          (
            '{{ uniqueKeys[i].precode }}'
            , 41
            , 21 
            , '{{ placeScheduleIds[i].place_schedule_id }}'
            , '特記事項'
            , 'e0002004-0000-0000-0091-000000000001'
            , '{{ uniqueKeys[i].connectioncode }}'
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          );
  getConsult:
    desc: "登録した受診の受診IDを取得する"
    db:
      query: |
        SELECT
          consult_id::text
        FROM
          resultcollector.consult
        ORDER BY
          consult_number ASC;
    bind:
      consultIds: current.rows
  createConsultNotes:
    desc: "事前に受診特記のレコードを作成する"
    loop: vars.recordCount
    db:
      query: |
        INSERT INTO
          resultcollector.consult_notes
          (consult_id, code, note, created_at, created_by)
        VALUES
          (
            '{{ consultIds[i].consult_id }}'
            , 'NOTE-EC2004-1'
            , '旧特記事項2004-1'
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          ),    
          (
            '{{ consultIds[i].consult_id }}'
            , 'NOTE-EC2004-2'
            , '旧特記事項2004-2'
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          );    
  createExamItemDetailOrders:
    desc: "事前に検査項目明細依頼のレコードを作成する"
    loop: vars.recordCount
    db:
      query: |
        INSERT INTO
          resultcollector.exam_item_detail_orders
          (consult_id, exam_item_detail_id, external_exam_item_detail_code, created_at, created_by)
        VALUES
          (
            '{{ consultIds[i].consult_id }}'
            , 2004913
            , 'ODR-EC2004-1' 
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          ),
          (
            '{{ consultIds[i].consult_id }}'
            , 2004914
            , 'ODR-EC2004-2' 
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          );    
  createConsultThresholds:
    desc: "事前に基準値のレコードを作成する"
    loop: vars.recordCount
    db:
      query: |
        INSERT INTO
          resultcollector.consult_thresholds
          (threshold_id, consult_id, priority, created_at, created_by)
        VALUES
          (
            'ec002004-0000-0000-0091-000000000001'
            , '{{ consultIds[i].consult_id }}'
            , 1
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          ),
          (
            'ec002004-0000-0000-0091-000000000002'
            , '{{ consultIds[i].consult_id }}'
            , 2
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          );
  createPreviousResults:
    desc: "事前に過去検査結果のレコードを作成する"
    loop: vars.recordCount
    db:
      query: |
        INSERT INTO
          resultcollector.previous_results
          (consult_id, exam_date, exam_item_detail_id, value, created_at, created_by)
        VALUES
          (
            '{{ consultIds[i].consult_id }}'
            , '2024-10-02'
            , 2004911
            , '100'
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          ),
          (
            '{{ consultIds[i].consult_id }}'
            , '2024-10-02'
            , 2004912
            , '200'
            , '2025-01-01T12:34:56.789'
            , 'ec2004'
          )
  createRequest:
    desc: "リクエストデータの作成"
    loop:
      count: vars.recordCount
    bind:
      requestBody:
        -
          sortNo: uniqueKeys[i].number
          connectionCode: uniqueKeys[i].connectioncode
          actionType: 0
          placeCode: "'P2004-91'"
          teamCode: "'T2004-91'"
          examDate: uniqueKeys[i].examdate
          consultNumber: uniqueKeys[i].newcode
          examineeCd: "'E2004912'"
          note: "'新特記事項'"
          previousResults:
            -
              examItemDetailCd: "'PRE-EC2004'"
              examDate: "'2024-10-02'"
              value: "'300'"
          consultThresholds:
            -
              thresholdCode: "'TID-EC2004'"
              priority: 1
          consultNotes:
            -
              code: "'NOTE-EC2004'"
              note: "'新特記事項2004'"
          examItemDetailOrders:
            -
              examItemDetailCd: "'ODR-EC2004'"
          inputNote: "'2004-91'"
  startBatch:
    desc: "処理の開始時間"
    bind:
      startTime: now()
  post:
    desc: "受診を登録_正常"
    req:
      /api/v1/external/consult:
        post:
          body:
            application/json:
              "{{ requestBody }}"
    test: |
      current.res.status == 200
    bind:
      endTime: now()
  endBatch:
    desc: "処理の終了時間"
    bind:
      timeKeeper:
        startTime: startTime.Format("2006-01-02T15:04:05Z07:00")
        endTime: endTime.Format("2006-01-02T15:04:05Z07:00")
        interval: endTime.Sub(startTime).Seconds() 
  confirmConsult:
    desc: "受診の登録を確認"
    db:
      query: |
        SELECT
          consult_id::text
          , consult_number
          , progress_status
          , export_status
          , place_schedule_id::text
          , note
          , examinee_id::text
          , external_connection_code
          , to_char(created_at, 'yyyymmdd') as created_at
          , created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.consult
        ORDER BY
          consult_number ASC;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].consult_number == uniqueKeys[0].newcode
      // 進捗状況がキャンセル(41)が来場待ち(11)に更新されたことを確認
      && current.rows[0].progress_status == 11
      // 結果出力状況が更新されないことを確認
      && current.rows[0].export_status == 21
      && current.rows[0].place_schedule_id == placeScheduleIds[0].place_schedule_id
      && current.rows[0].note == "新特記事項"
      && current.rows[0].examinee_id == "e0002004-0000-0000-0091-000000000002"
      && current.rows[0].external_connection_code == uniqueKeys[0].connectioncode
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].consult_number == uniqueKeys[vars.recordCount - 1].newcode
      // 進捗状況がキャンセル(41)が来場待ち(11)に更新されたことを確認
      && current.rows[vars.recordCount - 1].progress_status == 11
      // 結果出力状況が更新されないことを確認
      && current.rows[vars.recordCount - 1].export_status == 21
      && current.rows[vars.recordCount - 1].place_schedule_id == placeScheduleIds[vars.recordCount - 1].place_schedule_id
      && current.rows[vars.recordCount - 1].note == "新特記事項"
      && current.rows[vars.recordCount - 1].examinee_id == "e0002004-0000-0000-0091-000000000002"
      && current.rows[vars.recordCount - 1].external_connection_code == uniqueKeys[vars.recordCount - 1].connectioncode
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
    bind:
      consultIds: current.rows
  confirmConsultNotes:
    desc: "受診特記の登録を確認"
    db:
      query: |
        SELECT
          cn.consult_id::text
          , cn.code
          , cn.note
          , to_char(cn.created_at, 'yyyymmdd') as created_at
          , cn.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.consult_notes cn
        LEFT JOIN
          resultcollector.consult c
            on cn.consult_id = c.consult_id
        ORDER BY
          c.consult_number ASC;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].consult_id == consultIds[0].consult_id
      && current.rows[0].code == "NOTE-EC2004"
      && current.rows[0].note == "新特記事項2004"
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].consult_id == consultIds[vars.recordCount - 1].consult_id
      && current.rows[vars.recordCount - 1].code == "NOTE-EC2004"
      && current.rows[vars.recordCount - 1].note == "新特記事項2004"
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
  confirmExamItemDetailOrders:
    desc: "検査項目明細依頼の登録を確認"
    db:
      query: |
        SELECT
          e.consult_id::text
          , e.exam_item_detail_id
          , e.external_exam_item_detail_code
          , to_char(e.created_at, 'yyyymmdd') as created_at
          , e.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.exam_item_detail_orders e
        LEFT JOIN
          resultcollector.consult c
            on e.consult_id = c.consult_id
        ORDER BY
          c.consult_number ASC;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].consult_id == consultIds[0].consult_id
      && current.rows[0].exam_item_detail_id == 2004916
      && current.rows[0].external_exam_item_detail_code == "ODR-EC2004"
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"
      && current.rows[vars.recordCount - 1].consult_id == consultIds[vars.recordCount - 1].consult_id
      && current.rows[vars.recordCount - 1].exam_item_detail_id == 2004916
      && current.rows[vars.recordCount - 1].external_exam_item_detail_code == "ODR-EC2004"
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"
  confirmConsultThresholds:
    desc: "基準値の登録を確認"
    db:
      query: |
        SELECT
          ct.threshold_id::text
          , ct.consult_id::text
          , priority
          , to_char(ct.created_at, 'yyyymmdd') as created_at
          , ct.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.consult_thresholds ct
        LEFT JOIN
          resultcollector.consult c
            on ct.consult_id = c.consult_id
        ORDER BY
          c.consult_number ASC;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].consult_id == consultIds[0].consult_id
      && current.rows[0].priority == 1
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"      
      && current.rows[vars.recordCount - 1].consult_id == consultIds[vars.recordCount - 1].consult_id
      && current.rows[vars.recordCount - 1].priority == 1
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"      
  confirmPreviousResults:
    desc: "過去検査結果の登録を確認"
    db:
      query: |
        SELECT
          p.consult_id::text
          , to_char(p.exam_date, 'yyyymmdd') as exam_date
          , p.exam_item_detail_id
          , p.value
          , to_char(p.created_at, 'yyyymmdd') as created_at
          , p.created_by
          , to_char(CURRENT_DATE, 'yyyymmdd') as now
        FROM
          resultcollector.previous_results p
        LEFT JOIN
          resultcollector.consult c
            on p.consult_id = c.consult_id
        ORDER BY
          c.consult_number ASC;
    test: |
      len(current.rows) == vars.recordCount
      && current.rows[0].consult_id == consultIds[0].consult_id
      && current.rows[0].exam_date == "20241002"
      && current.rows[0].exam_item_detail_id == 2004913
      && current.rows[0].value == "300"
      && current.rows[0].created_at == current.rows[0].now
      && current.rows[0].created_by == "ExternalConnection"      
      && current.rows[vars.recordCount - 1].consult_id == consultIds[vars.recordCount - 1].consult_id
      && current.rows[vars.recordCount - 1].exam_date == "20241002"
      && current.rows[vars.recordCount - 1].exam_item_detail_id == 2004913
      && current.rows[vars.recordCount - 1].value == "300"
      && current.rows[vars.recordCount - 1].created_at == current.rows[vars.recordCount - 1].now
      && current.rows[vars.recordCount - 1].created_by == "ExternalConnection"      
    dump:
      expr: timeKeeper
      out: ../Dump/EC2004-91.json      