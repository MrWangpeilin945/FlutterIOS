desc: EC2004-17 キー重複チェック
runners:
  db: ${DB_HOST}
  req:
    endpoint: ${BACKEND_URL}
    skipValidateRequest: false
    skipValidateResponse: false
vars:
  request: "json://../Requests/EC2004-17.json"
steps:
  clearTable:
    desc: "関連テーブルのクリア"
    db:
      query: |
        -- 受診
        TRUNCATE TABLE resultcollector.consult CASCADE;
        -- 会場
        TRUNCATE TABLE resultcollector.places CASCADE; 
        -- 班
        TRUNCATE TABLE resultcollector.teams CASCADE;
        -- 受診者
        TRUNCATE TABLE resultcollector.examinees CASCADE;
        -- 検査メニュー
        TRUNCATE TABLE resultcollector.exam_menus CASCADE;
        -- 検査特記
        TRUNCATE TABLE resultcollector.exam_menu_note_codes CASCADE;
        -- 基準値パターン
        TRUNCATE TABLE resultcollector.thresholds CASCADE;
        -- 外部検査項目明細
        TRUNCATE TABLE resultcollector.external_exam_item_details CASCADE;
  insertData:
    desc: "関連テーブルに実行前データを登録"
    db:
      query: |
        -- 班
        INSERT INTO
          resultcollector.teams
          (team_id, team_code, name, order_number, created_at, created_by)
        VALUES('f0002004-0000-0000-0017-000000000001', 'T2004-17', '班', 1, CURRENT_TIMESTAMP, 'ec2004');
        -- 会場
        INSERT INTO
          resultcollector.places
          (place_id, place_code, name, order_number, created_at, created_by)
        VALUES('b0002004-0000-0000-0017-000000000001', 'P2004-17', '会場', 1, CURRENT_TIMESTAMP, 'ec2004');
        -- 会場日程
        INSERT INTO
          resultcollector.place_schedule
          (place_schedule_id, place_id, team_id, status, exam_date, start_time, created_at, created_by)
        VALUES('a0002004-0000-0000-0017-000000000001', 'b0002004-0000-0000-0017-000000000001', 'f0002004-0000-0000-0017-000000000001', 31, '2025/03/03', '1500', CURRENT_TIMESTAMP, 'ec2004');
        -- 受診者
        INSERT INTO
          resultcollector.examinees
          (examinee_id, examinee_code, name, kana_name, sex, birthdate, created_at, created_by)
        VALUES('e0002004-0000-0000-0017-000000000001', 'E20041701', '両備　一郎', 'リョウビ　イチロウ',   1, '1991-01-01', CURRENT_TIMESTAMP,'ec2004')
        ,     ('e0002004-0000-0000-0017-000000000002', 'E20041702', '両備　ニ郎', 'リョウビ　ジロウ',     1, '1992-02-02', CURRENT_TIMESTAMP,'ec2004')
        ,     ('e0002004-0000-0000-0017-000000000003', 'E20041703', '両備　三郎', 'リョウビ　サブロウ',   1, '1993-03-03', CURRENT_TIMESTAMP,'ec2004')
        ,     ('e0002004-0000-0000-0017-000000000004', 'E20041704', '両備　四郎', 'リョウビ　シロウ',     1, '1994-04-04', CURRENT_TIMESTAMP,'ec2004')
        ,     ('e0002004-0000-0000-0017-000000000005', 'E20041705', '両備　五郎', 'リョウビ　ゴロウ',     1, '1995-05-05', CURRENT_TIMESTAMP,'ec2004');
        -- 検査特記
        INSERT INTO
          resultcollector.exam_menu_note_codes
          (code, name, created_at, created_by)
        VALUES('NOTE-T200417-1', '検査特記2004-17-01', CURRENT_TIMESTAMP, 'ec2004');
        -- 基準値パターン
        INSERT INTO
          resultcollector.thresholds
          (threshold_id, threshold_code, name, order_number, created_at, created_by)
        VALUES('ec002004-0000-0000-0017-000000000001', 'TID-EC2004-1', 'EC2004基準値-1', 1, CURRENT_TIMESTAMP, 'ec2004')
        ,     ('ec002004-0000-0000-0017-000000000002', 'TID-EC2004-2', 'EC2004基準値-2', 1, CURRENT_TIMESTAMP, 'ec2004');
  post:
    desc: "キー重複チェック"
    req:
      /api/v1/external/consult:
        post:
          body:
            application/json:
              "{{ vars.request }}"
    test: |
      current.res.status == 207
      // レスポンスに5件のErrorObjectが返されることを確認
      && len(current.res.body) == 5
      && current.res.body[0].code == "10003"
      && current.res.body[0].inputNote == "20041701"
      && current.res.body[0].message == "キー項目が重複しています。SortNo: 1"
      && current.res.body[1].code == "10003"
      && current.res.body[1].inputNote == "20041702"
      && current.res.body[1].message == "キー項目が重複しています。SortNo: 1"
      && current.res.body[2].code == "10003"
      && current.res.body[2].inputNote == "20041703"
      && current.res.body[2].message == "キー項目が重複しています。ConsultThresholds.ThresholdCode: TID-EC2004-1"
      && current.res.body[3].code == "10003"
      && current.res.body[3].inputNote == "20041704"
      && current.res.body[3].message == "キー項目が重複しています。ConsultThresholds.Priority: 1"
      && current.res.body[4].code == "10003"
      && current.res.body[4].inputNote == "20041705"
      && current.res.body[4].message == "キー項目が重複しています。ConsultNotes.Code: NOTE-T200417-1"
    dump:
      expr: current.res.body
      out: ../Dump/EC2004-17.json
  confirmConsult:
    desc: "受診の登録を確認"
    db:
      query: |
        SELECT
          consult_id::text
        FROM
          resultcollector.consult;
    test: |
      // 受診が登録されていないことを確認
      len(current.rows) == 0
  confirmConsultNotes:
    desc: "受診特記の登録を確認"
    db:
      query: |
        SELECT
          consult_id::text
        FROM
          resultcollector.consult_notes;
    test: |
      // 受診特記が登録されていないことを確認
      len(current.rows) == 0
  confirmExamItemDetailOrders:
    desc: "検査項目明細依頼の登録を確認"
    db:
      query: |
        SELECT
          consult_id::text
        FROM
          resultcollector.exam_item_detail_orders;
    test: |
      // 検査項目明細依頼が登録されていないことを確認
      len(current.rows) == 0
  confirmConsultThresholds:
    desc: "基準値の登録を確認"
    db:
      query: |
        SELECT
          threshold_id::text
        FROM
          resultcollector.consult_thresholds;
    test: |
      // 基準値が登録されていないことを確認
      len(current.rows) == 0
  confirmPreviousResults:
    desc: "過去検査結果の登録を確認"
    db:
      query: |
        SELECT
          consult_id::text
        FROM
          resultcollector.previous_results;
    test: |
      // 過去検査結果が登録されていないことを確認
      len(current.rows) == 0
