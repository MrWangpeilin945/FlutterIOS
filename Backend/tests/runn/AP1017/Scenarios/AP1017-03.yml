desc: AP1017-03 会場ロック更新_無効なアクセストークン [401]
runners:
  req:
    endpoint: ${BACKEND_URL}
    openapi3: ${OPENAPI3_URL}
    skipValidateRequest: false
    skipValidateResponse: false
steps:
  getAccessToken:
    desc: "アクセストークンを取得します"
    include:
      path:
        ../../Helpers/adminAccessToken.yml
  put:
    desc: "会場ロック更新_無効なアクセストークン"
    req:
      /api/v1/placeSchedules/{placeScheduleId}/placeScheduleLockingStatus:
        put:
          headers:
            Authorization: "Bearer {{ steps.getAccessToken.token }}"
    test: |
      current.res.status == 401
    dump:
      expr: current.res.body
      out: ../Dump/AP1017-03.json

