services:
  frontend:
    build:
      context: .
      dockerfile: ./Frontend/Dockerfile
    ports:
      - 8000:80
    environment:
      - TZ=Asia/Tokyo
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: ./Backend/src/Wellship.WebAPI/Dockerfile
    ports:
      - 5000:80
    environment:
      - TZ=Asia/Tokyo
      - ASPNETCORE_HTTP_PORTS=80
      - ASPNETCORE_ENVIRONMENT=Development
      - RDS_USER_ID=postgres
      - RDS_USER_PASS=p@ssw0rd
      - RDS_ENDPOINT=Host=db;Port=5432;Database=dev01;
    depends_on:
      - db

  db:
    image: postgres:16.3
    restart: always
    ports:
      - "15434:5432"
    volumes:
      - ./Database/Docker/init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=p@ssw0rd
      - POSTGRES_DB=postgres
      - PGPASSWORD=p@ssw0r
